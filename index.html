async function registrarContatoFila(c, slot, tipo){
  const hoje=todayISO();
  const i={id:uuid(),cliente_id:c.id,tipo,texto:`Mensagem enviada (${slot||'contato'})`,data:hoje,hora:new Date().toTimeString().slice(0,5),created_at:new Date().toISOString()};
  state.interacoes.unshift(i);
  await upsertRow('interacoes',i);

  if(slot==='recompra'||slot==='posvenda'||slot==='aniversario'){
    // Cliente da carteira: só registra e adia o próximo aviso
    c.recompra_avisado=hoje;
    c.updated_at=new Date().toISOString();
    await upsertRow('clientes',c);
    toast('✅ Contato registrado');
  } else {
    await avancarRegua(c);
  }
  await cloudSave();
  dashboard();
}

// Régua 0 / +2 / +7: agenda o próximo toque ou manda descansar 30 dias
async function avancarRegua(c){
  const hoje=todayISO();
  const tent=tentativasProspect(c)+1;
  c.regua_tentativas=tent;
  c.regua_ultimo=hoje;
  c.status=ETAPA_AGUARDANDO;
  if(tent>=REGUA.tentativasMax){
    // Saiu da fila: volta pra prospecção sozinho em 30 dias
    c.status=ETAPA_PROSPECT;
    c.regua_tentativas=0;
    c.regua_proximo=somarDias(hoje,REGUA.descansoDias);
    toast(`😴 3 tentativas sem resposta — volta pra fila em ${REGUA.descansoDias} dias`,5000);
  } else {
    const intervalo=REGUA.intervalos[tent-1]??REGUA.intervalos[REGUA.intervalos.length-1];
    c.regua_proximo=somarDias(hoje,intervalo);
    toast(`🔔 Registrado — retorno em ${intervalo} dias`);
  }
  c.updated_at=new Date().toISOString();
  await upsertRow('clientes',c);
}

async function adiarRecompra(id){
  const c=state.clientes.find(x=>x.id===id);
  if(!c) return;
  c.recompra_avisado=somarDias(todayISO(),7);
  c.updated_at=new Date().toISOString();
  await upsertRow('clientes',c);
  await cloudSave();
  toast('⏭️ Adiado por 7 dias');
  dashboard();
}

</script>
    <script>
/* ===== prospeccao.js ===== */
const ETAPA_PROSPECT = '🎯 A prospectar';
const ETAPA_AGUARDANDO = '⏳ Aguardando resposta';
const ETAPA_RESPONDEU = '✅ Respondeu';
const ETAPA_NEGOCIACAO = '💰 Negociação';
const ETAPA_PERDIDO = '❌ Perdido';
// Contato errado/inexistente: sai das métricas e da fila do dia, mas o
// cadastro continua vivo pra você corrigir o número quando descobrir.
const ETAPA_CONTATO_ERRADO = '📵 Contato errado';
let _abaProspeccao='prospectar';
let _mesFechados=todayISO().slice(0,7);

function atividadesPeriodo(mes=todayISO().slice(0,7), dia=null){
  const tiposContato=['Ligação','WhatsApp','Reunião','E-mail'];
  const ints=(state.interacoes||[]).filter(i=>{const data=i.data||i.created_at?.slice(0,10)||'';const periodo=dia?data===dia:data.slice(0,7)===mes;return periodo&&tiposContato.some(t=>(i.tipo||'').includes(t));});
  return {total:ints.length,ligacoes:ints.filter(i=>(i.tipo||'').includes('Ligação')).length,whatsapp:ints.filter(i=>(i.tipo||'').includes('WhatsApp')).length,reunioes:ints.filter(i=>(i.tipo||'').includes('Reunião')).length};
}

function prospeccao(aba=_abaProspeccao){
  _abaProspeccao=aba;
  const mapa={prospectar:ETAPA_PROSPECT,aguardando:ETAPA_AGUARDANDO,respondeu:ETAPA_RESPONDEU,negociacao:ETAPA_NEGOCIACAO,perdidos:ETAPA_PERDIDO,errados:ETAPA_CONTATO_ERRADO};
  const atividades=atividadesPeriodo(), fechados=pedidosDoMes(_mesFechados);
  // Métricas ignoram quem está em "Contato errado": número furado não é
  // tentativa de venda e derrubava a conversão sem motivo.
  const contatosMes=(state.interacoes||[]).filter(i=>{const data=i.data||i.created_at?.slice(0,10)||'';return data.slice(0,7)===todayISO().slice(0,7)&&['Ligação','WhatsApp','Reunião','E-mail'].some(t=>(i.tipo||'').includes(t))&&!emQuarentena(i.cliente_id);});
  const clientesContatados=new Set(contatosMes.map(i=>i.cliente_id)).size;
  const errados=state.clientes.filter(c=>c.status===ETAPA_CONTATO_ERRADO).length;
  const clientesFechados=new Set(pedidosDoMes(todayISO().slice(0,7)).map(p=>p.cliente_id)).size;
  const conversao=clientesContatados?Math.round(clientesFechados/clientesContatados*100):0;
  const clientesEtapa=mapa[aba]?state.clientes.filter(c=>c.status===mapa[aba]):[];
  const tabs=[['prospectar','A prospectar'],['aguardando','Aguardando resposta'],['respondeu','Respondeu'],['negociacao','Negociação'],['fechados','Pedidos fechados'],['perdidos','Perdidos'],['errados',`📵 Contato errado${errados?' ('+errados+')':''}`]];
  $('prospeccao').innerHTML=`
    <div class="topbar"><div class="hello"><h2>🎯 Prospecção</h2><p>Do primeiro contato ao pedido fechado</p></div><div class="row"><button class="btn ghost" onclick="ativarNotificacoes()">🔔 Ativar alertas</button><button class="btn" onclick="prospectForm()">+ Novo prospect</button></div></div>
    <div class="grid cards prospect-metrics"><div class="card metric"><small>Contatos no mês</small><strong>${atividades.total}</strong></div><div class="card metric"><small>Ligações</small><strong>${atividades.ligacoes}</strong></div><div class="card metric"><small>WhatsApp</small><strong>${atividades.whatsapp}</strong></div><div class="card metric"><small>Pedidos fechados</small><strong>${pedidosDoMes(todayISO().slice(0,7)).length}</strong></div><div class="card metric"><small>Conversão no mês</small><strong>${conversao}%</strong></div></div>
    <div class="tabs stage-tabs">${tabs.map(([id,label])=>`<button class="${aba===id?'active':''}" onclick="prospeccao('${id}')">${label}</button>`).join('')}</div>
    ${aba==='errados'?`<p class="section-note" style="margin:-6px 0 14px">Estes cadastros ficam fora das métricas, da fila do dia e da recompra. Corrija o número na ficha e o cliente volta sozinho para a prospecção.</p>`:''}
    ${aba==='fechados'?pedidosFechadosView(fechados):`<div class="client-grid">${clientesEtapa.map(c=>prospectCard(c,aba)).join('')||vazioEtapa(aba)}</div>`}`;
}

function vazioEtapa(aba){
  return aba==='errados'
    ? '<div class="empty">Nenhum contato errado — tudo certo.</div>'
    : '<div class="empty">Nenhum cliente nesta etapa.</div>';
}

function prospectCard(c,aba){
  const ultimo=(state.interacoes||[]).find(i=>i.cliente_id===c.id), motivo=aba==='perdidos'&&ultimo?.tipo==='❌ Perdido'?ultimo.texto:'';
  const numOk=c.whatsapp&&whatsValido(c.whatsapp);
  const contatoBtns=(numOk?`<a class="btn small green" href="${urlWhats(c.whatsapp)}" target="_blank" rel="noopener" title="Chamar no WhatsApp com a mensagem pronta" onclick="event.preventDefault();contatarProspectWhatsApp('${c.id}')">💬 WhatsApp</a>`:c.whatsapp?`<button class="btn small ghost" style="color:var(--red)" title="Número incompleto — toque para corrigir" onclick="openClient('${c.id}')">📵 Corrigir número</button>`:'')+(c.instagram?`<a class="btn small ghost" href="${urlInsta(c.instagram)}" target="_blank" rel="noopener" title="Direct no Instagram (mensagem copiada)" onclick="event.preventDefault();contatarProspectInstagram('${c.id}')">📸 Instagram</a>`:'');
  const tent=tentativasProspect(c);
  const reguaInfo=aba==='aguardando'&&tent?`<div class="section-note" style="margin-top:8px">${tent}ª tentativa • retorno ${c.regua_proximo?fmt(c.regua_proximo):'hoje'}</div>`:(aba==='prospectar'&&c.regua_proximo&&c.regua_proximo>todayISO()?`<div class="section-note" style="margin-top:8px">😴 Descansando até ${fmt(c.regua_proximo)}</div>`:'');
  return `<div class="client-card prospect-card"><div onclick="openClient('${c.id}')"><h3>${esc(c.loja||c.nome)}</h3><div class="section-note">${esc(c.nome||'')} ${c.cidade?'• '+esc(c.cidade)+'-'+esc(c.estado||''):''}</div><div class="prospect-tags">${c.cnpj?`<span class="tag">CNPJ ${esc(c.cnpj)}</span>`:''}${c.origem?`<span class="tag green">${esc(c.origem)}</span>`:''}</div>${reguaInfo}${motivo?`<div class="loss-reason">${esc(motivo)}</div>`:''}</div><div class="prospect-actions">${contatoBtns}${acoesProspect(c,aba)}</div></div>`;
}

function acoesProspect(c,aba){
  if(aba==='prospectar') return `<button class="btn small" onclick="registrarContatoProspect('${c.id}','📞 Ligação')">📞 Liguei</button><button class="btn small ghost" onclick="marcarContatoErrado('${c.id}')" title="Número não existe ou não é da loja">📵</button>`;
  if(aba==='aguardando') return `<button class="btn small" onclick="marcarResposta('${c.id}')">✅ Respondeu</button><button class="btn small ghost" onclick="registrarContatoProspect('${c.id}','💬 WhatsApp')">🔁 Novo contato</button><button class="btn small ghost" onclick="marcarContatoErrado('${c.id}')" title="Número não existe ou não é da loja">📵</button><button class="btn small danger" onclick="marcarPerdido('${c.id}')">Sem interesse</button>`;
  if(aba==='respondeu') return `<button class="btn small" onclick="iniciarNegociacao('${c.id}')">Começar negociação</button><button class="btn small danger" onclick="marcarPerdido('${c.id}')">Sem interesse</button>`;
  if(aba==='negociacao') return `<button class="btn small green" onclick="novoPedido('${c.id}')">📦 Fechei o pedido</button><button class="btn small danger" onclick="marcarPerdido('${c.id}')">Perdido</button>`;
  if(aba==='perdidos') return `<button class="btn small ghost" onclick="reativarProspect('${c.id}')">🔁 Tentar novamente</button>`;
  if(aba==='errados') return `<button class="btn small" onclick="openClient('${c.id}')">✏️ Corrigir número</button><button class="btn small ghost" onclick="reativarProspect('${c.id}')">🔁 Voltar pra prospecção</button>`;
  return '';
}

// Abre o WhatsApp do prospect com a mensagem pronta E registra o contato.
// Não pergunta se respondeu: quem responde é o cliente, depois — e aí
// você marca "✅ Respondeu" na fila do dia ou aqui.
async function contatarProspectWhatsApp(id){
  const c=state.clientes.find(x=>x.id===id);
  if(!c) return;
  const slot=tentativasProspect(c)>0?'followup':'primeiro_contato';
  const url=urlWhats(c.whatsapp, msgSlot(slot,c));
  if(!url){ toast('⚠️ Prospect sem WhatsApp'); return; }
  window.open(url,'_blank');
  await registrarContatoProspect(id,'💬 WhatsApp');
}

// Instagram: copia a mensagem (o direct não aceita texto na URL) e registra
async function contatarProspectInstagram(id){
  const c=state.clientes.find(x=>x.id===id);
  if(!c) return;
  const slot=tentativasProspect(c)>0?'followup':'primeiro_contato';
  const texto=msgSlot(slot,c);
  if(texto) copiarTexto(texto,'Mensagem');
  window.open(urlInsta(c.instagram),'_blank');
  await registrarContatoProspect(id,'💬 Instagram');
}

function prospectForm(){
  document.body.insertAdjacentHTML('beforeend',`<div id="prospectOverlay" class="quick-overlay" onclick="if(event.target===this)this.remove()"><div class="quick-dialog wide"><div class="modal-head"><div><h3 style="margin:0">Novo prospect</h3><p class="section-note">Cadastre agora e complete os dados durante a prospecção.</p></div><button class="x" onclick="$('prospectOverlay').remove()">✕</button></div><div class="formgrid"><div><label>Nome da loja *</label><input id="pr_loja"></div><div><label>Responsável</label><input id="pr_nome"></div><div><label>WhatsApp</label><input id="pr_whatsapp" type="tel"></div><div><label>Instagram</label><input id="pr_instagram" placeholder="@loja"></div><div class="full"><label>CNPJ (opcional)</label><div class="row"><input id="pr_cnpj" placeholder="00.000.000/0001-00"><button class="btn ghost" onclick="buscarCNPJProspect()">Buscar</button></div></div><div><label>Cidade</label><input id="pr_cidade"></div><div><label>Estado</label><input id="pr_estado" maxlength="2"></div><div><label>Origem</label><select id="pr_origem"><option>Instagram</option><option>Google</option><option>Indicação</option><option>Feira</option><option>Visita</option><option>Lista própria</option><option>Outro</option></select></div><div><label>Potencial</label><select id="pr_potencial"><option>Alto</option><option selected>Médio</option><option>Baixo</option></select></div><div class="full"><label>Observações</label><textarea id="pr_obs"></textarea></div></div><div class="actions"><button class="btn" onclick="salvarProspect()">Salvar prospect</button><button class="btn ghost" onclick="$('prospectOverlay').remove()">Cancelar</button></div></div></div>`);
}

async function buscarCNPJProspect(){const d=await buscarCNPJ($('pr_cnpj')?.value||'');if(!d){toast('❌ CNPJ não encontrado');return;}$('pr_loja').value=d.nome_fantasia||d.razao_social||'';$('pr_cidade').value=d.municipio||'';$('pr_estado').value=d.uf||'';toast('✅ Dados preenchidos pelo CNPJ');}
function normalizar(v){return (v||'').toLowerCase().replace(/\D/g,'');}

async function salvarProspect(){
  const loja=$('pr_loja')?.value?.trim();if(!loja){toast('⚠️ Informe o nome da loja');return;}
  const cnpj=normalizar($('pr_cnpj')?.value),wpp=normalizar($('pr_whatsapp')?.value),insta=($('pr_instagram')?.value||'').toLowerCase().replace('@','').trim();
  const duplicado=state.clientes.find(c=>(cnpj&&normalizar(c.cnpj)===cnpj)||(wpp&&normalizar(c.whatsapp)===wpp)||(insta&&(c.instagram||'').toLowerCase().replace('@','').trim()===insta));
  if(duplicado){toast(`⚠️ ${duplicado.loja||duplicado.nome} já está cadastrado`,5000);return;}
  const now=new Date().toISOString();
  const c={id:uuid(),loja,nome:$('pr_nome')?.value||'',whatsapp:$('pr_whatsapp')?.value||'',email:'',instagram:$('pr_instagram')?.value||'',cep:'',endereco:'',cidade:$('pr_cidade')?.value||'',estado:($('pr_estado')?.value||'').toUpperCase(),tipo_cliente:'novo',temperatura:'Morno',status:ETAPA_PROSPECT,tags:[],obs:$('pr_obs')?.value||'',proxacao:'Primeiro contato',proxdata:todayISO(),aniversario:'',cnpj:$('pr_cnpj')?.value||'',razao_social:'',nome_fantasia:'',inscricao_estadual:'',situacao_cadastral:'',qtd_lojas:'1',vendedores:'',aparelhos_mes:'',potencial:$('pr_potencial')?.value||'Médio',marcas:'',cat_mais_vendida:'',categorias:[],perfil:'',hobby:'',esposa:'',filhos:'',info_pessoal:'',contatos:[],created_at:now,updated_at:now,origem:$('pr_origem')?.value||'Manual'};
  state.clientes.unshift(c);await upsertRow('clientes',c);$('prospectOverlay')?.remove();toast('✅ Prospect cadastrado');prospeccao('prospectar');
}

// Registra a tentativa de contato e avança a régua (0 / +2 / +7).
// Sem perguntas: o retorno é agendado sozinho.
async function registrarContatoProspect(id,tipo){
  const c=state.clientes.find(x=>x.id===id);if(!c)return;
  const i={id:uuid(),cliente_id:id,tipo,texto:'Contato realizado, aguardando resposta',data:todayISO(),hora:new Date().toTimeString().slice(0,5),created_at:new Date().toISOString()};
  state.interacoes.unshift(i);
  await upsertRow('interacoes',i);
  await avancarRegua(c);
  await cloudSave();
  prospeccao(c.status===ETAPA_PROSPECT?'prospectar':'aguardando');
}

async function mudarEtapaProspect(id,status,tipo,texto){const c=state.clientes.find(x=>x.id===id);if(!c)return;c.status=status;c.updated_at=new Date().toISOString();const i={id:uuid(),cliente_id:id,tipo,texto,data:todayISO(),hora:new Date().toTimeString().slice(0,5),created_at:new Date().toISOString()};state.interacoes.unshift(i);await upsertRow('clientes',c);await upsertRow('interacoes',i);}
async function marcarResposta(id){
  const c=state.clientes.find(x=>x.id===id);
  if(c){ c.regua_tentativas=0; c.regua_proximo=''; }
  await mudarEtapaProspect(id,ETAPA_RESPONDEU,'✅ Resposta','Cliente respondeu');
  toast('✅ Resposta registrada');
  prospeccao('respondeu');
}
async function iniciarNegociacao(id){await mudarEtapaProspect(id,ETAPA_NEGOCIACAO,'💰 Negociação','Negociação iniciada');prospeccao('negociacao');}
function marcarPerdido(id){const c=state.clientes.find(x=>x.id===id);if(!c)return;const motivos=['Sem interesse','Preço','Já trabalha com outra marca','Pedido mínimo','Não respondeu','Momento inadequado','Outro'];document.body.insertAdjacentHTML('beforeend',`<div id="perdidoOverlay" class="quick-overlay" onclick="if(event.target===this)this.remove()"><div class="quick-dialog"><h3>Marcar como perdido</h3><p class="section-note">${esc(c.loja||c.nome)}</p><label>Motivo</label><select id="perdidoMotivo" onchange="$('perdidoOutro').style.display=this.value==='Outro'?'block':'none'">${motivos.map(m=>`<option>${m}</option>`).join('')}</select><input id="perdidoOutro" placeholder="Descreva o motivo" style="display:none;margin-top:10px"><div class="actions"><button class="btn danger" onclick="confirmarPerdido('${id}')">Mover para perdidos</button><button class="btn ghost" onclick="$('perdidoOverlay').remove()">Cancelar</button></div></div></div>`);}
async function confirmarPerdido(id){const selecionado=$('perdidoMotivo')?.value||'Sem interesse',motivo=selecionado==='Outro'?$('perdidoOutro')?.value?.trim():selecionado;if(!motivo){toast('⚠️ Informe o motivo');return;}await mudarEtapaProspect(id,ETAPA_PERDIDO,'❌ Perdido',motivo);$('perdidoOverlay')?.remove();prospeccao('perdidos');}
async function reativarProspect(id){await mudarEtapaProspect(id,ETAPA_PROSPECT,'🔁 Reativação','Prospect reativado');prospeccao('prospectar');}

function pedidosFechadosView(pedidos){const total=pedidos.reduce((s,p)=>s+parseFloat(p.valor||0),0);return `<div class="card"><div class="section-heading"><div><h3 class="section-title" style="margin:0">Pedidos fechados</h3><div class="section-note">${pedidos.length} pedido${pedidos.length!==1?'s':''} • ${fmtMoney(total)}</div></div><input type="month" value="${_mesFechados}" onchange="_mesFechados=this.value;prospeccao('fechados')" style="max-width:180px"></div><div class="quick-list">${pedidos.map(p=>{const c=state.clientes.find(x=>x.id===p.cliente_id);return `<button onclick="openClient('${p.cliente_id}','pedidos')"><b>${esc(c?.loja||'Cliente')}</b><small>${fmt(p.data)} • ${fmtMoney(p.valor)}</small></button>`}).join('')||'<div class="empty">Nenhum pedido fechado neste mês.</div>'}</div></div>`;}

function posvenda(){
  const lista=state.clientes.filter(c=>c.status!==ETAPA_CONTATO_ERRADO).map(c=>statusRecompra(c)).filter(Boolean);
  const hora=lista.filter(x=>x.fase==='hora').sort((a,b)=>a.faltam-b.faltam);
  const atrasado=lista.filter(x=>x.fase==='atrasado').sort((a,b)=>a.faltam-b.faltam);
  const cedo=lista.filter(x=>x.fase==='cedo').sort((a,b)=>a.faltam-b.faltam);
  const bloco=(label,nota,arr,classe)=>`
    <h3 class="section-title" style="margin-top:22px">${label} <span class="badge">${arr.length}</span></h3>
    <p class="section-note" style="margin:-8px 0 12px">${nota}</p>
    <div class="client-grid">${arr.map(x=>recompraCard(x,classe)).join('')||'<div class="empty">Ninguém nesta fila.</div>'}</div>`;
  $('posvenda').innerHTML=`
    <div class="topbar"><div class="hello"><h2>❤️ Pós-venda e recompra</h2><p>Cada cliente no ritmo dele — aviso ${AVISO_ANTES} dias antes de fechar o ciclo</p></div></div>
    <div class="grid cards" style="margin-bottom:4px">
      <div class="card metric"><small>⚠️ Atrasados</small><strong>${atrasado.length}</strong></div>
      <div class="card metric"><small>📦 Hora de chamar</small><strong>${hora.length}</strong></div>
      <div class="card metric"><small>⏳ Ainda cedo</small><strong>${cedo.length}</strong></div>
      <div class="card metric"><small>📅 Ciclo padrão</small><strong>${CICLO_PADRAO}d</strong><span class="metric-hint">Para quem tem 1 pedido só</span></div>
    </div>
    ${bloco('⚠️ Atrasado','Passou do ciclo de compra — prioridade máxima',atrasado,'late')}
    ${bloco('📦 Hora de chamar','O estoque dele está acabando agora',hora,'attention')}
    ${bloco('⏳ Ainda cedo','Comprou recentemente, não precisa incomodar',cedo,'good')}`;
}

function recompraCard(x,classe){
  const c=x.c;
  const detalhe=x.fase==='atrasado'
    ? `Atrasado ${Math.abs(x.faltam)} dia${Math.abs(x.faltam)>1?'s':''}`
    : x.fase==='hora'
      ? `Vence em ${x.faltam} dia${x.faltam!==1?'s':''}`
      : `Falta ${x.faltam} dia${x.faltam!==1?'s':''}`;
  const ritmo=x.ciclo.proprio?`ritmo próprio de ${x.ciclo.dias}d (${x.ciclo.pedidos} pedidos)`:`ciclo padrão de ${x.ciclo.dias}d`;
  return `<div class="client-card">
    <div onclick="openClient('${c.id}')">
      <h3>${esc(c.loja||c.nome)}</h3>
      <div class="section-note">Último pedido: ${fmt(x.ultimo.data)} • ${fmtMoney(x.ultimo.valor)}</div>
      <div class="section-note">${x.dias} dias sem comprar • ${ritmo}</div>
      <div class="recompra-status ${classe}">${detalhe}</div>
    </div>
    <div class="prospect-actions">
      ${c.whatsapp?`<button class="btn small green" title="Chamar com a mensagem de recompra pronta" onclick="filaWhats('${c.id}','recompra')">💬 WhatsApp</button>`:''}
      ${c.instagram?`<button class="btn small ghost" title="Direct no Instagram (mensagem copiada)" onclick="filaInsta('${c.id}','recompra')">📸</button>`:''}
      <button class="btn small ghost" onclick="registrarPosVenda('${c.id}')">Registrar pós-venda</button>
      <button class="btn small" onclick="novoPedido('${c.id}')">+ Recompra</button>
    </div>
  </div>`;
}

async function registrarPosVenda(id){const texto=prompt('Como foi o pós-venda?','Cliente contatado para acompanhar os produtos');if(!texto)return;await mudarEtapaProspect(id,'❤️ Pós-venda / Recompra','⭐ Pós-venda',texto);toast('✅ Pós-venda registrado');posvenda();}
async function ativarNotificacoes(){if(!('Notification'in window)){toast('Este navegador não permite notificações');return;}const p=await Notification.requestPermission();toast(p==='granted'?'🔔 Alertas ativados':'⚠️ Permissão não concedida');if(p==='granted')notificarLembretes();}
function notificarLembretes(){if(!('Notification'in window)||Notification.permission!=='granted')return;const hoje=todayISO();state.lembretes.filter(l=>!l.feito&&(l.data||hoje)<=hoje).forEach(l=>{const key=`wiwu_notificado_${hoje}_${l.id}`;if(localStorage.getItem(key))return;new Notification('WIWU OS • Follow-up',{body:`${l.titulo}${l.cliente?' — '+l.cliente:''}`});localStorage.setItem(key,'1');});}

// ── CONTATO ERRADO (quarentena, v5.6) ────────────────────────────
// Cliente com número furado sai das métricas, da fila do dia e da
// recompra — sem apagar o cadastro. Corrigir o número o traz de volta.
function emQuarentena(clienteId){
  const c=state.clientes.find(x=>x.id===clienteId);
  return !!c&&c.status===ETAPA_CONTATO_ERRADO;
}

async function marcarContatoErrado(id){
  const c=state.clientes.find(x=>x.id===id);
  if(!c) return;
  c.status=ETAPA_CONTATO_ERRADO;
  c.regua_tentativas=0; c.regua_proximo='';
  c.updated_at=new Date().toISOString();
  const i={id:uuid(),cliente_id:id,tipo:'📵 Contato errado',texto:`Número sem retorno: ${c.whatsapp||'—'}`,data:todayISO(),hora:new Date().toTimeString().slice(0,5),created_at:new Date().toISOString()};
  state.interacoes.unshift(i);
  await upsertRow('interacoes',i);
  await upsertRow('clientes',c);
  await cloudSave();
  toast('📵 Fora das métricas até corrigir o número',4000);
  prospeccao(_abaProspeccao);
}

// ── GESTÃO DE CAIXAS FECHADAS ─────────────────────────────────────
// Torna o card "Caixas fechadas" clicável e permite editar a quantidade
// de caixas em cada pedido do mês, salvando no Supabase e no aparelho.


function abrirCaixasFechadas(mes){
  const pedidos=pedidosDoMes(mes).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const total=pedidos.reduce((s,p)=>s+parseInt(p.caixas_fonte||0,10),0);
  const nomeMes=new Date(mes+'-02T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});


  document.body.insertAdjacentHTML('beforeend',`
    <div id="caixasFechadasOverlay" class="quick-overlay" onclick="if(event.target===this)this.remove()">
      <div class="quick-dialog wide">
        <div class="modal-head">
          <div>
            <h3 style="margin:0">📦 Caixas fechadas</h3>
            <p class="section-note">${nomeMes} • <strong id="caixasTotalModal">${total}</strong> caixa${total!==1?'s':''}</p>
          </div>
          <button class="x" onclick="$('caixasFechadasOverlay').remove()">✕</button>
        </div>
        <div style="padding:12px 14px;margin-bottom:12px;border-radius:14px;background:var(--purple-soft);border:1px solid var(--purple-line);font-size:13px;color:var(--muted)">
          Altere a quantidade de caixas de fonte de cada pedido. O bônus será recalculado automaticamente.
        </div>
        <div class="quick-list" style="gap:10px">
          ${pedidos.map(p=>{
            const c=state.clientes.find(x=>x.id===p.cliente_id);
            const qtd=parseInt(p.caixas_fonte||0,10);
            return `<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.025)">
              <div style="min-width:0">
                <b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c?.loja||c?.nome||'Cliente')}${p.obs?` — ${esc(p.obs)}`:''}</b>
                <small style="display:block;color:var(--muted);margin-top:3px">${fmt(p.data)} • ${fmtMoney(p.valor)}</small>
              </div>
              <div style="display:flex;align-items:center;gap:7px">
                <button class="btn ghost small" style="width:34px;height:34px;padding:0" onclick="ajustarQtdCaixa('${p.id}',-1)">−</button>
                <input class="caixa-qtd-input" data-pedido-id="${p.id}" type="number" min="0" step="1" value="${qtd}" oninput="atualizarTotalCaixasModal()" style="width:72px;text-align:center;font-weight:800;font-size:16px;padding:8px 6px">
                <button class="btn ghost small" style="width:34px;height:34px;padding:0" onclick="ajustarQtdCaixa('${p.id}',1)">+</button>
              </div>
            </div>`;
          }).join('')||'<div class="empty">Nenhum pedido registrado neste mês.</div>'}
        </div>
        <div class="actions" style="margin-top:16px">
          ${pedidos.length?`<button class="btn" onclick="salvarCaixasFechadas('${mes}')">💾 Salvar quantidades</button>`:''}
          <button class="btn ghost" onclick="$('caixasFechadasOverlay').remove()">Fechar</button>
        </div>
      </div>
    </div>`);
}


function ajustarQtdCaixa(pedidoId,delta){
  const input=document.querySelector(`.caixa-qtd-input[data-pedido-id="${pedidoId}"]`);
  if(!input) return;
  const atual=Math.max(0,parseInt(input.value||0,10));
  input.value=Math.max(0,atual+delta);
  atualizarTotalCaixasModal();
}


function atualizarTotalCaixasModal(){
  const total=[...document.querySelectorAll('.caixa-qtd-input')]
    .reduce((s,input)=>s+Math.max(0,parseInt(input.value||0,10)),0);
  const el=$('caixasTotalModal');
  if(el) el.textContent=total;
}


async function salvarCaixasFechadas(mes){
  const inputs=[...document.querySelectorAll('.caixa-qtd-input')];
  let alterados=0;


  for(const input of inputs){
    const pedido=state.pedidos.find(p=>p.id===input.dataset.pedidoId);
    if(!pedido) continue;
    const novaQtd=Math.max(0,parseInt(input.value||0,10));
    const atual=Math.max(0,parseInt(pedido.caixas_fonte||0,10));
    if(novaQtd===atual) continue;


    pedido.caixas_fonte=novaQtd;
    pedido.updated_at=new Date().toISOString();
    const calculo=calcComissao(pedido);
    pedido.bonus_fonte=calculo.bonusFonte;
    pedido.comissao=calculo.total;
    pedido.comissao_pct=calculo.pct;
    await upsertRow('pedidos',pedido);
    alterados++;
  }


  localSave();
  await cloudSave();
  $('caixasFechadasOverlay')?.remove();
  faturamento();
  toast(alterados?`✅ ${alterados} pedido${alterados!==1?'s':''} atualizado${alterados!==1?'s':''}`:'✅ Nenhuma alteração necessária');
}


// Aplica o comportamento clicável ao card depois que a tela de faturamento renderiza.
const _faturamentoComCaixasBase = faturamento;
faturamento = function(){
  _faturamentoComCaixasBase();
  const mes=_mesFaturamento||todayISO().slice(0,7);
  const cards=[...document.querySelectorAll('#faturamento .card.metric')];
  const card=cards.find(el=>el.querySelector('small')?.textContent?.includes('Caixas fechadas'));
  if(card){
    card.classList.add('metric-button');
    card.style.cursor='pointer';
    card.setAttribute('role','button');
    card.setAttribute('tabindex','0');
    card.onclick=()=>abrirCaixasFechadas(mes);
    card.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();abrirCaixasFechadas(mes);} };
    const hint=card.querySelector('.metric-hint');
    if(hint) hint.textContent='Clique para visualizar e editar';
  }
};

</script>
<script>

// ── NAVEGAÇÃO ─────────────────────────────────────────────────────
const PAGES = [
  ['dashboard',   '⚡', 'Hoje',        'principal'],
  ['clientes',    '👥', 'Clientes',    'principal'],
  ['prospeccao',  '🎯', 'Prospecção',  'principal'],
  ['pipeline',    '📊', 'Pipeline',    'principal'],
  ['feira',       '🎪', 'Modo Feira',  'principal'],
  ['lembretes',   '⏰', 'Lembretes',   'principal'],
  ['faturamento', '💰', 'Faturamento', 'financeiro'],
  ['categorias',  '📦', 'Categorias',  'financeiro'],
  ['ranking',     '🏆', 'Ranking',     'financeiro'],
  ['posvenda',    '❤️', 'Recompra',    'financeiro'],
  ['scripts',     '📝', 'Mensagens',   'ferramentas'],
  ['concorrentes','⚔️', 'Concorrentes','ferramentas'],
];

const SECTIONS = {
  principal:   '— Principal',
  financeiro:  '— Financeiro',
  ferramentas: '— Ferramentas',
};

function initNav(){
  let lastSec = '';
  let navHtml = '';
  PAGES.forEach(([id, icon, label, sec]) => {
    if(sec !== lastSec){
      navHtml += `<div class="nav-section">${SECTIONS[sec]||sec}</div>`;
      lastSec = sec;
    }
    navHtml += `<button onclick="showPage('${id}')" data-page="${id}">${icon} ${label}</button>`;
  });
  $('nav').innerHTML = navHtml;

  // Bottom nav (mobile) — primeiros 4 + menu completo
  $('bottom').innerHTML = PAGES.slice(0,4).map(([id,icon,label])=>
    `<button onclick="showPage('${id}')" data-page="${id}"><span style="font-size:20px">${icon}</span><span>${label}</span></button>`
  ).join('') + `<button onclick="abrirMenuCompleto()"><span style="font-size:20px">☰</span><span>Mais</span></button>`;
}

function abrirMenuCompleto(){
  let lastSec = '';
  let html = '';
  PAGES.forEach(([id, icon, label, sec]) => {
    if(sec !== lastSec){
      html += `<div class="nav-section">${SECTIONS[sec]||sec}</div>`;
      lastSec = sec;
    }
    html += `<button onclick="showPage('${id}');this.closest('.bottom-menu')?.remove()" data-page="${id}">${icon} ${label}</button>`;
  });
  const el = document.createElement('div');
  el.className = 'bottom-menu';
  el.innerHTML = `<div class="bottom-menu-panel">${html}<button onclick="this.closest('.bottom-menu').remove()" style="width:100%">✕ Fechar</button></div>`;
  el.addEventListener('click', e => { if(e.target===el) el.remove(); });
  document.body.appendChild(el);
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));
  document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));
  const renders={dashboard,clientes,prospeccao,pipeline,feira,lembretes,faturamento,categorias,ranking,posvenda,scripts:mensagens,concorrentes};
  if(renders[id]) renders[id]();
}

// ── INIT ──────────────────────────────────────────────────────────
async function start(){
  localLoad();
  migrarScriptsSlots();
  initNav();
  dashboard();
  // Sidebar ativo
  document.querySelector('[data-page="dashboard"]')?.classList.add('active');
  // Conectar nuvem
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    cloud = true;
    const sincronizado = await cloudLoad();
    // Reclassifica os itens dos pedidos já importados com a regra atual
    // (ver reclassificarItensPedidos em config.js). Não altera valores.
    if(reclassificarItensPedidos()) await cloudSave();
    // Garante as mensagens usadas pelo CRM sem sobrescrever textos editados
    if(migrarScriptsSlots()){
      for(const sc of state.scripts) await upsertRow('scripts',sc);
    }
    dashboard(); // Rerender com dados da nuvem
    if(sincronizado) toast('☁️ Sincronizado com a nuvem');
    else toast('⚠️ Nuvem indisponível — usando dados deste aparelho',5000);
    if(typeof notificarLembretes==='function') notificarLembretes();
  } catch(e){
    toast('📱 Modo offline — dados locais');
  }
}

start();

</script>

<script>
function abrirRelatorioVendas(){
  $('relatorioVendasOverlay')?.remove();
  const mes=_mesFaturamento||todayISO().slice(0,7);
  const fim=new Date(Number(mes.slice(0,4)),Number(mes.slice(5,7)),0).getDate();
  const el=document.createElement('div');el.id='relatorioVendasOverlay';el.className='quick-overlay';
  el.onclick=e=>{if(e.target===el)el.remove()};
  el.innerHTML=`<div class="quick-dialog wide"><div class="modal-head"><h3>Relatório de vendas</h3><button class="x" aria-label="Fechar" onclick="$('relatorioVendasOverlay').remove()">✕</button></div><div class="formgrid"><div><label for="rvInicio">Data inicial</label><input id="rvInicio" type="date" value="${mes}-01" onchange="atualizarRelatorioVendas()"></div><div><label for="rvFim">Data final</label><input id="rvFim" type="date" value="${mes}-${fim}" onchange="atualizarRelatorioVendas()"></div><div class="full"><label for="rvCliente">Cliente</label><select id="rvCliente" onchange="atualizarRelatorioVendas()"><option value="">Todos os clientes</option>${state.clientes.map(c=>`<option value="${esc(c.id)}">${esc(c.loja||c.nome||'Cliente')}</option>`).join('')}</select></div></div><div id="rvConteudo" style="margin-top:18px"></div><div class="actions"><button class="btn" onclick="baixarRelatorioVendas()">Baixar Excel (CSV)</button><button class="btn ghost" onclick="imprimirRelatorioVendas()">Imprimir / salvar PDF</button></div><p class="section-note">Pedidos registrados no sistema, pela data da venda. Frete apresentado separadamente.</p></div>`;
  document.body.appendChild(el);atualizarRelatorioVendas();
}
function dadosRelatorioVendas(){
 const inicio=$('rvInicio').value,fim=$('rvFim').value,cliente=$('rvCliente').value;
 if(!inicio||!fim||inicio>fim)throw Error('Informe um período válido: a data inicial deve ser anterior ou igual à final.');
 return pedidosValidos().filter(p=>p.data&&p.data.slice(0,10)>=inicio&&p.data.slice(0,10)<=fim&&(!cliente||p.cliente_id===cliente)).sort((a,b)=>a.data.localeCompare(b.data)).map(p=>{
 const c=state.clientes.find(c=>c.id===p.cliente_id),d=detalhesPedido(p.id)||{};
 const produtos=Number(p.valor)||0,frete=Number(fretePedido(p))||0;
 const cats=normalizarCategorias(p.categorias||[]);
 const row=[fmt(p.data),d.numero||'',c?.loja||c?.nome||'Cliente',p.tipo_cliente==='novo'?'Novo':'Carteira',produtos,frete,produtos+frete,Math.max(0,parseInt(p.caixas_fonte,10)||0),cats.length,cats.map(id=>CATEGORIAS.find(c=>c.id===id)?.label||id).join(', ')];
 row.categorias=cats;row.clienteId=p.cliente_id;return row;
 });
}
function resumoRelatorioVendas(rows){
 const soma=i=>rows.reduce((s,r)=>s+r[i],0);
 const cats=new Set(rows.flatMap(r=>r.categorias));
 return {produtos:soma(4),frete:soma(5),total:soma(6),caixas:soma(7),ocorrencias:soma(8),categorias:cats.size,clientes:new Set(rows.map(r=>r.clienteId)).size};
}
function totaisRelatorioVendas(rows){const t=resumoRelatorioVendas(rows);return ['TOTAL',rows.length+' pedidos',t.clientes+' clientes','',t.produtos,t.frete,t.total,t.caixas,t.ocorrencias,t.categorias+' categorias diferentes'];}
function cabecalhosRelatorioVendas(){return ['Data','Pedido','Cliente','Tipo','Produtos (R$)','Frete (R$)','Total (R$)','Caixas fechadas de fonte','Qtd. categorias qualificadas','Categorias qualificadas'];}
function htmlRelatorioVendas(rows){
 const t=resumoRelatorioVendas(rows);
 const cell=(v,i)=>i>=4&&i<=6?fmtMoney(v):esc(String(v));
 const resumo=[['TOTAL GERAL (COM FRETE)',fmtMoney(t.total)],['Produtos (sem frete)',fmtMoney(t.produtos)],['Frete',fmtMoney(t.frete)],['Pedidos / clientes',rows.length+' / '+t.clientes],['Caixas fechadas de fonte',t.caixas],['Categorias diferentes',t.categorias]];
 const categorias=CATEGORIAS.map(c=>({label:c.label,pedidos:rows.filter(r=>r.categorias.includes(c.id)).length})).filter(c=>c.pedidos);
 return `<div class="rv-summary">${resumo.map(([label,value])=>`<div class="rv-stat"><small>${label}</small><strong>${value}</strong></div>`).join('')}</div><div class="rv-scroll"><table class="rv-table"><thead><tr>${cabecalhosRelatorioVendas().map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${i>=4&&i<=8?'rv-number':''}">${cell(v,i)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="10">Nenhuma venda encontrada neste período.</td></tr>'}</tbody>${rows.length?`<tfoot><tr>${totaisRelatorioVendas(rows).map((v,i)=>`<td>${cell(v,i)}</td>`).join('')}</tr></tfoot>`:''}</table></div><p class="rv-note">Categorias qualificadas conforme o cadastro do pedido. Soma das quantidades por pedido: <b>${t.ocorrencias}</b>. Categorias diferentes no período: <b>${t.categorias}</b>. Caixas fechadas de fonte conforme quantidade registrada em cada pedido.</p>${categorias.length?`<h3>Resumo por categoria</h3><table class="rv-table rv-categories"><thead><tr><th>Categoria qualificada</th><th>Pedidos com a categoria</th></tr></thead><tbody>${categorias.map(c=>`<tr><td>${esc(c.label)}</td><td>${c.pedidos}</td></tr>`).join('')}</tbody></table>`:''}`;
}
function atualizarRelatorioVendas(){try{$('rvConteudo').innerHTML=htmlRelatorioVendas(dadosRelatorioVendas())}catch(e){$('rvConteudo').textContent=e.message}}
function csvRelatorioVendas(rows){
 const safe=v=>'"'+String(v).replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';
 const t=resumoRelatorioVendas(rows);
 return '\uFEFF'+[cabecalhosRelatorioVendas(),...rows,totaisRelatorioVendas(rows),[],['Categorias diferentes no período',t.categorias],['Soma das categorias qualificadas por pedido',t.ocorrencias],[],['Categoria qualificada','Pedidos com a categoria'],...CATEGORIAS.map(c=>[c.label,rows.filter(r=>r.categorias.includes(c.id)).length]).filter(r=>r[1])].map(r=>r.map((v,i)=>safe(i>=4&&i<=6&&typeof v==='number'?v.toFixed(2).replace('.',','):v)).join(';')).join('\r\n');
}
function baixarRelatorioVendas(){
 try{const rows=dadosRelatorioVendas();if(!rows.length){toast('Nenhuma venda para exportar.');return}
 const url=URL.createObjectURL(new Blob([csvRelatorioVendas(rows)],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download=`WIWU_Vendas_${$('rvInicio').value}_${$('rvFim').value}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }catch(e){toast(e.message)}
}
function imprimirRelatorioVendas(){
 try{const rows=dadosRelatorioVendas();if(!rows.length){toast('Nenhuma venda para imprimir.');return}const w=window.open('','_blank');if(!w){toast('Permita abrir a janela do relatório para salvar em PDF.');return}
 const cliente=state.clientes.find(c=>c.id===$('rvCliente').value);
 w.document.write('<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>WIWU - Relatório de vendas</title><style>'+document.getElementById('rvStyles').textContent+'@page{size:A4 landscape;margin:12mm}body{font:11px Arial;color:#222;margin:0}.rv-table{font-size:9px}.rv-scroll{overflow:visible!important;max-height:none!important}.rv-table th,.rv-table td{padding:6px 4px}.rv-summary{grid-template-columns:repeat(3,1fr)}thead{display:table-header-group}tfoot{display:table-row-group}tr{break-inside:avoid}.rv-stat{break-inside:avoid}.rv-stat strong{font-size:17px}</style></head><body><h1>WIWU - Relatório de vendas</h1><p>Período: '+esc(fmt($('rvInicio').value))+' a '+esc(fmt($('rvFim').value))+' | Cliente: '+esc(cliente?.loja||cliente?.nome||'Todos os clientes')+'</p>'+htmlRelatorioVendas(rows)+'</body></html>');w.document.close();w.focus();w.print();
 }catch(e){toast(e.message)}
}
</script>
