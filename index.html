<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

    <title>WIWU OS V5.7.2</title>
    <style>
:root{
  /* Tema claro clean — roxo WIWU como único acento */
  --bg:#f6f7f9;--panel:#ffffff;--panel2:#f2f3f7;
  --surface:#ffffff;--surface2:#f4f5f8;--surface3:#eceef3;
  --card:#ffffff;--card2:#f7f8fa;
  --line:#e4e6ec;--border:#e4e6ec;--line-strong:#d3d6df;
  --text:#15161c;--muted:#6b7180;
  --purple:#7c3aed;--purple2:#7c3aed;--purple-soft:#f3eeff;--purple-line:#d9c9ff;
  --green:#16a34a;--green-soft:#e9f8ee;
  --orange:#d97706;--orange-soft:#fdf3e3;
  --red:#dc2626;--red-soft:#fdecec;
  --blue:#0284c7;--blue-soft:#e8f4fd;
  --radius:14px;--radius-sm:10px;--radius-lg:18px;
  --shadow:0 1px 2px rgba(16,20,35,.05);--shadow-lg:0 8px 28px rgba(16,20,35,.10)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:var(--radius-sm);padding:11px 13px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--purple)}
input::placeholder,textarea::placeholder{color:#9aa0ad}
textarea{min-height:92px;resize:vertical}
label{font-size:12px;color:var(--muted);display:block;margin:11px 0 7px}
select option{background:#fff;color:var(--text)}

/* Layout */
.app{display:grid;grid-template-columns:292px 1fr;min-height:100vh}
.sidebar{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);background:var(--panel);padding:24px 18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:26px}
.logo{width:44px;height:44px;border-radius:var(--radius-sm);background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex-shrink:0}
.brand h1{margin:0;font-size:19px;letter-spacing:-.01em}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
.nav{display:grid;gap:4px}
.nav-section{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:14px 16px 6px;font-weight:600}
.nav button{background:transparent;color:var(--muted);text-align:left;border-radius:var(--radius-sm);padding:10px 13px;font-size:14px;display:flex;align-items:center;gap:10px;transition:background .15s,color .15s}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.active{background:var(--purple-soft);color:var(--purple);font-weight:650}
.content{padding:30px 34px 110px;min-width:0}

/* Topbar */
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:24px}
.hello h2{font-size:25px;margin:0 0 5px;letter-spacing:-.02em;font-weight:700}.hello p{color:var(--muted);margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{padding:6px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:12px}
.pill.good{color:var(--green);background:var(--green-soft);border-color:#c7ebd3}
.pill.warn{color:var(--orange);background:var(--orange-soft);border-color:#f2ddb4}

/* Buttons */
.btn{background:var(--purple);color:#fff;border-radius:var(--radius-sm);padding:10px 14px;font-weight:600;font-size:14px;box-shadow:none;text-decoration:none;display:inline-flex;gap:7px;align-items:center;justify-content:center;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:none;font-weight:550}
.btn.ghost:hover{background:var(--surface2);filter:none}
.btn.danger{background:var(--red)}
.btn.green{background:var(--green)}
.btn.orange{background:var(--orange)}
.btn.small{padding:7px 10px;border-radius:8px;font-size:12.5px}

/* Pages */
.page{display:none}.page.active{display:block}

/* Grid & Cards */
.grid{display:grid;gap:16px}
.cards{grid-template-columns:repeat(4,minmax(150px,1fr))}
.cards-3{grid-template-columns:repeat(3,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.metric-button{color:var(--text);text-align:left;width:100%;transition:border-color .15s,box-shadow .15s}.metric-button:hover{border-color:var(--purple-line);box-shadow:var(--shadow-lg)}.metric-hint{display:block;margin-top:7px;color:var(--muted);font-size:12px;font-weight:500}

.metric small{color:var(--muted);font-size:12px}
.metric strong{display:block;font-size:27px;margin-top:7px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
.two{grid-template-columns:1.1fr .9fr}
.three{grid-template-columns:repeat(3,1fr)}
.section-title{font-size:15px;font-weight:650;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}

/* List & Items */
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.item b{display:block;margin-bottom:2px}
.item span{font-size:12px;color:var(--muted)}

/* Tags */
.tag{display:inline-flex;padding:4px 9px;border-radius:6px;background:var(--surface3);color:var(--muted);font-size:11px;margin:2px;font-weight:600}
.tag.hot{background:var(--red-soft);color:var(--red)}
.tag.warm{background:var(--orange-soft);color:var(--orange)}
.tag.cold{background:var(--blue-soft);color:var(--blue)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.novo{background:var(--blue-soft);color:var(--blue)}
.tag.carteira{background:var(--purple-soft);color:var(--purple)}

/* Toolbar */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.toolbar input{max-width:380px}

/* Client Grid */
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.client-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.client-card:hover{border-color:var(--purple-line);box-shadow:var(--shadow-lg)}
.client-card h3{margin:0 0 4px;font-size:16px}

/* Actions */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* Quick contact actions in client/prospect cards */
.card-actions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.card-actions .btn{flex:1}

/* Form */
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 14px}
.full{grid-column:1/-1}

/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);padding:13px;min-height:400px}
.col h3{font-size:13px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.lead{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.lead:hover{border-color:var(--purple-line)}

/* Tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 16px;overflow-x:auto}
.tabs button{padding:7px 13px;border-radius:8px;background:var(--surface2);border:1px solid transparent;color:var(--muted);white-space:nowrap;font-size:13px;font-weight:550}
.tabs button.active{background:var(--purple-soft);border-color:var(--purple-line);color:var(--purple)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,22,32,.38);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:28px 16px}
.modal.show{display:flex}
.modal-card{width:min(1040px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.x{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--line);color:var(--muted);flex-shrink:0}

/* Timeline */
.timeline{border-left:2px solid var(--purple-line);padding-left:16px;display:grid;gap:10px}
.timeline .event{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px}

/* Fair */
.fair-hero{text-align:center;padding:24px}
.plus{width:72px;height:72px;border-radius:var(--radius-lg);background:var(--purple);color:#fff;display:grid;place-items:center;font-size:38px;margin:0 auto 12px}

/* Progress */
.progress{height:6px;border-radius:99px;background:var(--surface3);overflow:hidden;margin:8px 0}
.progress-bar{height:100%;border-radius:99px;transition:width .4s}

/* Categories */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.cat-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;font-size:13px}
.cat-item.selected{background:var(--purple-soft);border-color:var(--purple);color:var(--purple);font-weight:600}
.cat-item .cat-icon{font-size:22px;margin-bottom:6px}

/* Toast */
.toast{position:fixed;right:20px;bottom:20px;background:#15161c;color:#fff;border:0;box-shadow:var(--shadow-lg);padding:13px 17px;border-radius:var(--radius-sm);font-size:14px;display:none;z-index:100;max-width:300px}
.toast.show{display:block}

/* Bottom nav mobile */
.bottom{display:none}

/* Menu completo (mobile) — acesso a todas as abas */
.bottom-menu{position:fixed;inset:0;z-index:400;background:rgba(20,22,32,.38);display:flex;align-items:flex-end;justify-content:center}
.bottom-menu-panel{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:16px 14px 22px;display:grid;gap:5px;max-height:82vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.bottom-menu-panel .nav-section{padding:10px 12px 4px}
.bottom-menu-panel button{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--text);padding:12px 14px;font-size:14px;text-align:left}
.bottom-menu-panel button.active{background:var(--purple-soft);border-color:var(--purple-line);color:var(--purple);font-weight:600}
.bottom-menu-panel button:hover{border-color:var(--purple-line)}

/* Misc */
.empty{color:var(--muted);padding:20px;text-align:center;font-size:14px}
.divider{height:1px;background:var(--line);margin:16px 0}
.danger-zone{border:1px solid #f0c2c2!important;background:var(--red-soft)!important}
.setup-box{background:var(--surface3);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px;color:#4c1d95;overflow:auto;font-size:12px;white-space:pre}
.badge{display:inline-flex;min-width:20px;height:20px;border-radius:99px;background:var(--purple);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;padding:0 6px}

/* RMA */
.rma-item{background:var(--red-soft);border:1px solid #f0c2c2;border-radius:var(--radius-sm);padding:12px}
.rma-item.resolved{background:var(--green-soft);border-color:#c7ebd3}

/* Commission */
.commission-card{background:var(--purple-soft);border:1px solid var(--purple-line);border-radius:var(--radius);padding:18px}

/* Ranking */
.rank-item{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:8px}
.rank-num{width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}

/* Feed */
.feed-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.feed-icon{width:34px;height:34px;border-radius:var(--radius-sm);background:var(--purple-soft);display:grid;place-items:center;flex-shrink:0;font-size:16px}

@media(max-width:920px){
  .app{display:block}
  .sidebar{display:none}
  .content{padding:20px 16px 96px}
  .topbar{display:block}.topbar .row{margin-top:12px}
  .hello h2{font-size:26px}
  .cards{grid-template-columns:repeat(2,1fr)}
  .cards-3{grid-template-columns:repeat(2,1fr)}
  .two,.three{grid-template-columns:1fr}
  .formgrid{grid-template-columns:1fr}
  .toolbar{display:grid}.toolbar input{max-width:none}
  .kanban{grid-auto-columns:82vw}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:7px 6px env(safe-area-inset-bottom);z-index:30}
  .bottom button{background:transparent;color:var(--muted);font-size:10px;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .bottom button.active{background:var(--purple-soft);color:var(--purple);font-weight:650}
  .modal{padding:8px}.modal-card{border-radius:var(--radius)}
  .cat-grid{grid-template-columns:repeat(3,1fr)}
}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.section-note{font-size:12px;color:var(--muted)}
.recurring-summary{padding:7px 12px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:700;white-space:nowrap}
.client-revenue-list{display:flex;flex-direction:column;gap:8px}
.client-revenue-row{width:100%;display:grid;grid-template-columns:38px minmax(150px,1fr) 125px 120px 14px;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);text-align:left;cursor:pointer;font:inherit}
.client-revenue-row:hover{border-color:var(--purple-line);background:var(--purple-soft)}
.abc-badge,.abc-dot{display:inline-flex;align-items:center;justify-content:center;font-weight:800;border-radius:9px}.abc-badge{width:34px;height:34px;font-size:15px}.abc-dot{width:23px;height:23px;font-size:11px;margin-right:5px}
.abc-a{background:var(--green-soft);color:var(--green)}.abc-b{background:var(--orange-soft);color:var(--orange)}.abc-c{background:var(--surface3);color:var(--muted)}

.client-recurrence.is-recurring strong,.client-recurrence.is-recurring small{color:var(--green)}.client-revenue-value{text-align:right;font-weight:700;color:var(--purple)}.client-revenue-arrow{font-size:22px;color:var(--muted)}
.abc-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
@media(max-width:700px){.section-heading{align-items:flex-start;flex-direction:column}.client-revenue-row{grid-template-columns:38px 1fr auto}.client-recurrence{grid-column:2}.client-revenue-value{grid-column:3;grid-row:1}.client-revenue-arrow{display:none}}
.quick-overlay{position:fixed;inset:0;z-index:220;background:rgba(20,22,32,.38);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
.quick-dialog{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-lg)}.quick-dialog.wide{width:min(760px,100%)}.quick-dialog>h3{margin:0 0 6px}

.prospect-metrics{margin-bottom:18px}.stage-tabs{margin:0 0 18px}.prospect-card{display:flex;flex-direction:column;justify-content:space-between;gap:16px}.prospect-tags{margin-top:10px}.prospect-actions{display:flex;gap:7px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}.loss-reason{margin-top:10px;padding:9px 11px;border-radius:8px;background:var(--red-soft);color:var(--red);font-size:12px}
.recompra-status{display:inline-flex;margin-top:12px;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:650}.recompra-status.good{background:var(--green-soft);color:var(--green)}.recompra-status.attention{background:var(--orange-soft);color:var(--orange)}.recompra-status.late{background:var(--red-soft);color:var(--red)}
@media(max-width:700px){.quick-overlay{padding:8px}.quick-dialog{border-radius:var(--radius)}.prospect-metrics{grid-template-columns:repeat(2,1fr)}}

</style>

// Descobre a subcategoria de um produto dentro da sua categoria
function subcategoriaProduto(nome, categoria){
  const lista=SUBCATEGORIAS[categoria];
  if(!lista) return '';
  const t=String(nome||'').toLowerCase();
  const achou=lista.find(sc=>sc.re.test(t));
  return achou?achou.id:'';
}

function labelSub(categoria, subId){
  const sc=(SUBCATEGORIAS[categoria]||[]).find(x=>x.id===subId);
  return sc?sc.label:'Sem item identificado';
}

// Soma as unidades por subcategoria de uma lista de itens de pedido
function somarSubcategorias(itens, categoria){
  const soma={};
  (itens||[]).forEach(i=>{
    if(categoria && i.categoria!==categoria) return;
    if(!i.categoria || !i.quantidade) return;
    const sub=i.sub||subcategoriaProduto(i.produto,i.categoria);
    const chave=categoria?sub:`${i.categoria}|${sub}`;
    soma[chave]=(soma[chave]||0)+Number(i.quantidade);
  });
  return soma;
}

// ── Supabase ──────────────────────────────────────────────────────
let sb = null, cloud = false;

async function cloudLoad(){
  if(!sb) return;
  let ok = true;
  try {
    const tables = ['clientes','lembretes','scripts','interacoes','pedidos','rmas','concorrentes'];
    for(const t of tables){
      const locais = Array.isArray(state[t]) ? [...state[t]] : [];
      const {data, error} = await sb.from(t).select('*').order('created_at',{ascending:false});
      if(error){ ok=false; console.warn('cloudLoad erro em '+t, error.message); continue; }
      if(data && t==='pedidos'){
        const remotosPorId=new Map(data.map(item=>[item.id,item]));
        // A nuvem é a fonte principal. Só recupera itens marcados explicitamente
        // como pendentes por uma falha de conexão; pedidos apagados não voltam.
        const recuperar=locais.filter(item=>item._sync_pending===true);
        recuperar.forEach(item=>remotosPorId.set(item.id,item));
        state[t]=[...remotosPorId.values()].sort((a,b)=>(b.created_at||b.data||'').localeCompare(a.created_at||a.data||''));
        if(recuperar.length){
          const {error:recError}=await sb.from('pedidos').upsert(recuperar.map(pedidoParaNuvem),{onConflict:'id'});
          if(recError){ ok=false; console.warn('Falha ao recuperar pedidos locais:',recError.message); }
          else recuperar.forEach(item=>delete item._sync_pending);
        }
      }else if(data) state[t] = data;
    }
    const {data:cfg,error:cfgError} = await sb.from('config').select('*').eq('key','state').maybeSingle();
    if(cfgError) ok=false;
    if(cfg && cfg.value){
      const parsed = JSON.parse(cfg.value||'{}');
      ['pipeline','metas','comissao','pedidoDetalhes','registros','tags','interesses'].forEach(k=>{ if(parsed[k]) state[k]=parsed[k]; });
      // Histórico: a tabela interacoes não guarda data/hora, então a
      // versão completa fica no config. Usa a maior das duas listas.
      if(Array.isArray(parsed.interacoes) && parsed.interacoes.length >= (state.interacoes||[]).length){
        state.interacoes = parsed.interacoes;
      }
      aplicarExtrasDaNuvem(parsed.extras);
    }
  } catch(e){ ok=false; console.warn('cloudLoad error',e); }
  localSave();
  cloud=ok;
  return ok;
}

async function cloudSave(){
  localSave();
  if(!sb) return;
  try {
    const cfg = {pipeline:state.pipeline,metas:state.metas,comissao:state.comissao,pedidoDetalhes:state.pedidoDetalhes||{},registros:state.registros,tags:state.tags,interesses:state.interesses,
                 // Campos que as tabelas do Supabase não têm (régua, recompra,
                 // slots das mensagens e o histórico). Vão aqui dentro para
                 // sincronizar entre aparelhos sem precisar alterar o banco.
                 extras:extrasParaNuvem(), interacoes:state.interacoes||[]};
    const {error} = await sb.from('config').upsert({key:'state',value:JSON.stringify(cfg)},{onConflict:'key'});
    if(error) console.warn('cloudSave erro config:', error.message);
  } catch(e){ console.warn('cloudSave error',e); }
}

// ── COMPATIBILIDADE COM O BANCO (v5.6.2) ─────────────────────────
// As tabelas do Supabase foram criadas antes de várias funcionalidades e
// não têm as colunas novas. O PostgREST recusa a linha INTEIRA (erro
// PGRST204) quando recebe um campo que a tabela não possui — então uma
// única coluna a mais fazia o salvamento na nuvem falhar por completo.
//
// Em vez de listar o que remover (que quebra a cada campo novo), aqui
// está a LISTA DO QUE A TABELA ACEITA, conferida direto no banco. Todo
// campo fora dessa lista viaja no registro `config`, que é JSON livre.

// Campos que o app usa e a tabela não tem — precisam ir para o config
// para não se perderem ao trocar de aparelho.
function camposExtras(table, row){
  const ok=COLS_ACEITAS[table];
  if(!ok) return {};
  const extra={};
  Object.keys(row).forEach(k=>{
    if(k.startsWith('_')) return;
    if(!ok.includes(k) && row[k]!==undefined && row[k]!=='') extra[k]=row[k];
  });
  return extra;
}

function limparParaTabela(table, row){
  const copia={...row};
  delete copia._sync_pending;
  const ok=COLS_ACEITAS[table];
  if(!ok) return copia;
  Object.keys(copia).forEach(k=>{ if(!ok.includes(k)) delete copia[k]; });
  return copia;
}

// Empacota, por tabela e por id, tudo que o banco não guarda
function extrasParaNuvem(){
  const pacote={};
  [['clientes',state.clientes],['scripts',state.scripts],['lembretes',state.lembretes]].forEach(([t,lista])=>{
    const porId={};
    (lista||[]).forEach(row=>{
      const e=camposExtras(t,row);
      if(Object.keys(e).length) porId[row.id]=e;
    });
    if(Object.keys(porId).length) pacote[t]=porId;
  });
  return pacote;
}

function aplicarExtrasDaNuvem(extras){
  if(!extras) return;
  const destino={clientes:state.clientes,scripts:state.scripts,lembretes:state.lembretes};
  Object.entries(extras).forEach(([t,porId])=>{
    const lista=destino[t];
    if(!lista) return;
    Object.entries(porId||{}).forEach(([id,campos])=>{
      const row=lista.find(x=>x.id===id);
      if(row) Object.assign(row,campos);
    });
  });
}

async function upsertRow(table, row){
  if(table==='pedidos') row._sync_pending=true;
  localSave();
  if(!sb) return;
  try {
    const payload=table==='pedidos'?pedidoParaNuvem(row):limparParaTabela(table,row);
    const {error} = await sb.from(table).upsert(payload,{onConflict:'id'});
    if(error){
      cloud=false;
      console.warn('upsertRow erro em '+table+':', error.message, 'payload:', payload);
      toast('⚠️ Salvo neste aparelho, mas a nuvem falhou',5000);
      return false;
    }
    if(table==='pedidos'){ delete row._sync_pending; localSave(); }
    // Campos fora do schema (régua, slot, histórico) precisam do config
    if(['clientes','scripts','interacoes','lembretes'].includes(table)) await cloudSave();
    console.log('✅ Salvo em '+table+':', row.id); return true;
  } catch(e){ cloud=false; console.warn('upsertRow error',e); toast('⚠️ Salvo neste aparelho, mas a nuvem falhou',5000); return false; }
}

function pedidoParaNuvem(p){
  return {

    caixas_fonte:p.caixas_fonte,categorias:p.categorias||[],obs:p.obs||'',
    comissao:p.comissao,comissao_pct:p.comissao_pct,bonus_fonte:p.bonus_fonte,
    data:p.data,created_at:p.created_at||new Date().toISOString()
  };
}

async function deleteRow(table, id){

}

  const valor = parseFloat(pedido.valor||0);
  const fontes = parseInt(pedido.caixas_fonte||0);
  const tabela = state.comissao || COMISSAO;
  const regras = tabela[tipo] || tabela.novo || COMISSAO.novo;
  const regra = regras.slice().reverse().find(r => cats >= r.min) || regras[0];
  const percentual = Number(regra.pct||0);
  const pct = percentual / 100;
  const bonusUnitario = Number(tabela.bonusFonte ?? COMISSAO.bonusFonte);
  return { pct: percentual, comissaoBase: valor*pct, bonusFonte: fontes*bonusUnitario, total: valor*pct + fontes*bonusUnitario };
}

const MSG_SLOTS = [

// Garante que todo slot usado pelo CRM tenha um script correspondente.
// Roda depois de carregar os dados (nuvem ou aparelho) sem sobrescrever
// o que o Kauã já editou.
function migrarScriptsSlots(){
  if(!Array.isArray(state.scripts)) state.scripts=[];
  let mudou=false;
  MSG_SLOTS.forEach(def=>{
    if(state.scripts.some(s=>s.slot===def.slot)) return;
    // Reaproveita um script antigo com título parecido antes de criar outro
    const antigo=state.scripts.find(s=>!s.slot&&(s.titulo||'').toLowerCase().includes(def.titulo.toLowerCase()));
    if(antigo){ antigo.slot=def.slot; mudou=true; return; }
    state.scripts.push({id:uuid(),slot:def.slot,titulo:def.titulo,texto:def.texto});
    mudou=true;
  });
  return mudou;
}

// ── RÉGUA DE FOLLOW-UP E CICLO DE RECOMPRA (v5.5) ────────────────
// Régua acordada: tentativa no dia 0, retorno em +2, depois +7.
// Depois da 3ª tentativa o prospect sai da fila e volta em 30 dias.
const REGUA = { intervalos:[2,5], tentativasMax:3, descansoDias:30 };
// Cliente sem histórico suficiente usa este ciclo (Kauã: compram a cada 30-45 dias)
const CICLO_PADRAO = 35;
// Quantos dias antes de fechar o ciclo o CRM avisa
const AVISO_ANTES = 7;
// Piso e teto do ciclo calculado. O piso evita que pedidos lançados
// em dias próximos (import em lote, pedido complementar) gerem um
// ciclo irreal de 7 ou 14 dias e fiquem cobrando contato sem motivo.
const CICLO_MIN = 21, CICLO_MAX = 120;
// Só usa o ritmo próprio com histórico de verdade
const PEDIDOS_PARA_RITMO = 3;

function diasEntre(aISO, bISO){
  if(!aISO||!bISO) return 0;
  return Math.round((new Date(bISO+'T12:00:00') - new Date(aISO+'T12:00:00'))/86400000);
}
function somarDias(diasISO, dias){
  const d=new Date((diasISO||todayISO())+'T12:00:00');
  d.setDate(d.getDate()+dias);
  return d.toISOString().slice(0,10);
}

function pedidosCliente(id){
  return (state.pedidos||[])
    .filter(p=>p.cliente_id===id&&p.data)
    .sort((a,b)=>(b.data||'').localeCompare(a.data||''));
}
function ultimoPedidoCliente(id){ return pedidosCliente(id)[0]||null; }

// Ritmo real do cliente: média dos intervalos entre pedidos.
// Com um pedido só, usa o ciclo padrão.
function cicloCliente(id){
  const ps=pedidosCliente(id);
  if(ps.length<PEDIDOS_PARA_RITMO) return {dias:CICLO_PADRAO, proprio:false, pedidos:ps.length};
  // Agrupa pedidos do mesmo dia ou de dias vizinhos: dois pedidos na
  // mesma semana são a mesma compra (complemento, frete separado),
  // não um ciclo de 3 dias.
  const datas=[...new Set(ps.map(p=>p.data))].sort();
  const compras=[datas[0]];
  datas.slice(1).forEach(d=>{ if(diasEntre(compras[compras.length-1],d)>=7) compras.push(d); });
  if(compras.length<PEDIDOS_PARA_RITMO) return {dias:CICLO_PADRAO, proprio:false, pedidos:compras.length};
  let soma=0;
  for(let i=1;i<compras.length;i++) soma+=diasEntre(compras[i-1],compras[i]);
  const media=Math.round(soma/(compras.length-1));
  return {dias:Math.max(CICLO_MIN,Math.min(CICLO_MAX,media)), proprio:true, pedidos:compras.length};
}

// Situação de recompra de um cliente com histórico de pedido
function statusRecompra(c){
  const ultimo=ultimoPedidoCliente(c.id);
  if(!ultimo) return null;
  const ciclo=cicloCliente(c.id);
  const dias=diasEntre(ultimo.data, todayISO());
  const vence=somarDias(ultimo.data, ciclo.dias);
  const faltam=diasEntre(todayISO(), vence);
  let fase='cedo';
  if(faltam<0) fase='atrasado';
  else if(faltam<=AVISO_ANTES) fase='hora';
  return {c, ultimo, ciclo, dias, vence, faltam, fase};
}

// ── RECLASSIFICAÇÃO DOS ITENS JÁ IMPORTADOS (v5.7.1) ─────────────
// A categoria/item de cada produto fica gravada no pedido no momento da
// importação. Quando a regra melhora (ex.: o carregador veicular
// "WARRIORS 200W" caía em Mochilas porque Warriors é nome de mochila),
// os pedidos antigos continuariam errados. Esta função reprocessa os
// itens salvos usando a regra atual. Mexe SÓ na classificação dos itens
// — não toca no valor, na comissão nem nas categorias qualificadas do
// pedido, então nada de dinheiro muda.
function reclassificarItensPedidos(){
  if(typeof categoriaProduto!=='function') return false;
  const det=state.pedidoDetalhes||{};
  let mudou=0;
  Object.values(det).forEach(d=>{
    (d.itens||[]).forEach(i=>{
      const cat=categoriaProduto(i.produto);
      const sub=subcategoriaProduto(i.produto,cat);
      if(i.categoria!==cat||i.sub!==sub){ i.categoria=cat; i.sub=sub; mudou++; }
    });
  });
  return mudou>0;
}

// Tentativas de contato feitas na rodada atual de prospecção
function tentativasProspect(c){
  return Number(c.regua_tentativas||0);
}

async function saveClient(id){
  const loja=$('cf_loja')?.value?.trim();
  const nome=$('cf_nome')?.value?.trim();
  if(!loja&&!nome){ toast('⚠️ Preencha o nome da loja'); return; }

  const novoCnpj=($('cf_cnpj')?.value||'').replace(/\D/g,'');
  const novoWpp=($('cf_whatsapp')?.value||'').replace(/\D/g,'');
  const novoInsta=($('cf_instagram')?.value||'').toLowerCase().replace('@','').trim();
  const duplicado=state.clientes.find(c=>c.id!==id&&((novoCnpj&&String(c.cnpj||'').replace(/\D/g,'')===novoCnpj)||(novoWpp&&String(c.whatsapp||'').replace(/\D/g,'')===novoWpp)||(novoInsta&&String(c.instagram||'').toLowerCase().replace('@','').trim()===novoInsta)));
  if(duplicado){toast(`⚠️ Possível duplicado: ${duplicado.loja||duplicado.nome}`,5000);return;}

  const cats=[...document.querySelectorAll('.cat-item.selected')].map(el=>el.dataset.cat);
  const ctNomes=[...document.querySelectorAll('.ct_nome')].map(el=>el.value);
  const ctCargos=[...document.querySelectorAll('.ct_cargo')].map(el=>el.value);
  const ctWpps=[...document.querySelectorAll('.ct_wpp')].map(el=>el.value);
  const contatos=ctNomes.map((n,i)=>({nome:n,cargo:ctCargos[i],whatsapp:ctWpps[i]})).filter(c=>c.nome||c.whatsapp);

  const now = new Date().toISOString();
  const existing = id ? state.clientes.find(x=>x.id===id) : null;

  const c = {
    id: id||uuid(),
    loja: $('cf_loja')?.value||'',
    nome: $('cf_nome')?.value||'',
    whatsapp: $('cf_whatsapp')?.value||'',
    email: $('cf_email')?.value||'',
    instagram: $('cf_instagram')?.value||'',
    cep: $('cf_cep')?.value||'',
    endereco: $('cf_endereco')?.value||'',
    cidade: $('cf_cidade')?.value||'',
    estado: $('cf_estado')?.value||'',
    tipo_cliente: $('cf_tipo')?.value||'novo',
    temperatura: $('cf_temp')?.value||'Morno',
    status: $('cf_status')?.value||state.pipeline[0],
    tags: ($('cf_tags')?.value||'').split(',').map(t=>t.trim()).filter(Boolean),
    obs: $('cf_obs')?.value||'',
    proxacao: $('cf_proxacao')?.value||'',
    proxdata: $('cf_proxdata')?.value||'',
    aniversario: $('cf_aniversario')?.value||'',
    cnpj: $('cf_cnpj')?.value||'',
    razao_social: $('cf_razao')?.value||'',
    nome_fantasia: $('cf_fantasia')?.value||'',
    inscricao_estadual: $('cf_ie')?.value||'',
    situacao_cadastral: $('cf_situacao')?.value||'',
    qtd_lojas: $('cf_lojas')?.value||'1',
    vendedores: $('cf_vendedores')?.value||'',
    aparelhos_mes: $('cf_aparelhos')?.value||'',
    potencial: $('cf_potencial')?.value||'',
    marcas: $('cf_marcas')?.value||'',
    cat_mais_vendida: $('cf_catmais')?.value||'',
    categorias: cats,
    perfil: $('cf_perfil')?.value||'',
    hobby: $('cf_hobby')?.value||'',
    esposa: $('cf_esposa')?.value||'',
    filhos: $('cf_filhos')?.value||'',
    info_pessoal: $('cf_pessoal')?.value||'',
    contatos,
    created_at: existing?.created_at||now,
    updated_at: now,
    origem: existing?.origem||'Manual',
  };

  if(id){ const i=state.clientes.findIndex(x=>x.id===id); state.clientes[i]=c; }
  else state.clientes.unshift(c);

  await upsertRow('clientes', c);
  toast('✅ Cliente salvo!');
  closeModal();
  clientes();
}

async function deleteClient(id){
  const c = state.clientes.find(x=>x.id===id);
  const nome = c?.loja || c?.nome || 'este cliente';
  if(!confirm(`Excluir ${nome}?\n\nTambém serão removidos pedidos, lembretes, histórico e RMA vinculados a ele.`)) return;

  const pedidos = state.pedidos.filter(x=>x.cliente_id===id).map(x=>x.id);
  const lembretes = state.lembretes.filter(x=>x.cliente_id===id || x.cliente===nome).map(x=>x.id);
  const interacoes = state.interacoes.filter(x=>x.cliente_id===id).map(x=>x.id);
  const rmas = state.rmas.filter(x=>x.cliente_id===id).map(x=>x.id);

  state.clientes = state.clientes.filter(x=>x.id!==id);
  state.pedidos = state.pedidos.filter(x=>x.cliente_id!==id);
  state.lembretes = state.lembretes.filter(x=>x.cliente_id!==id && x.cliente!==nome);
  state.interacoes = state.interacoes.filter(x=>x.cliente_id!==id);
  state.rmas = state.rmas.filter(x=>x.cliente_id!==id);

  await deleteRow('clientes', id);
  for(const pid of pedidos) await deleteRow('pedidos', pid);
  for(const lid of lembretes) await deleteRow('lembretes', lid);
  for(const iid of interacoes) await deleteRow('interacoes', iid);
  for(const rid of rmas) await deleteRow('rmas', rid);
  await cloudSave();

  toast('🗑️ Cliente e vínculos excluídos');
  closeModal();
  clientes();
}

function exportClientes(){
  const csv=['Loja,Nome,WhatsApp,Cidade,Estado,Status,Temperatura,Tipo,Categorias,CNPJ']
    .concat(state.clientes.map(c=>[
      c.loja,c.nome,c.whatsapp,c.cidade,c.estado,
      c.status,c.temperatura,c.tipo_cliente,
      (c.categorias||[]).join('|'),c.cnpj
    ].map(v=>`"${(v||'').replace(/"/g,'""')}"`).join(','))).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`clientes_wiwu_${todayISO()}.csv`;
  a.click();
  toast('⬇️ Exportado!');
}

// ── PAINEL DE SITUAÇÃO (v5.6) ────────────────────────────────────
// Resolve três coisas que só se resolviam pelo formulário inteiro:
// mudar a etapa, ver em que tentativa da régua o contato está,
// e corrigir um número de WhatsApp errado.
function painelSituacao(c){
  const fixas=[ETAPA_PROSPECT,ETAPA_AGUARDANDO,ETAPA_RESPONDEU,ETAPA_NEGOCIACAO,ETAPA_PERDIDO,ETAPA_CONTATO_ERRADO];
  const etapas=[...fixas,...(state.pipeline||[]).filter(p=>!fixas.includes(p))];
  const atual=c.status||ETAPA_PROSPECT;
  const tent=typeof tentativasProspect==='function'?tentativasProspect(c):0;
  const numOk=!c.whatsapp||whatsValido(c.whatsapp);
  const rec=typeof statusRecompra==='function'?statusRecompra(c):null;

  // Linha da régua: em que tentativa está e quando é o retorno
  let regua='';
  if(atual===ETAPA_AGUARDANDO||tent>0){
    const prox=c.regua_proximo?fmt(c.regua_proximo):'hoje';
    const venceu=!c.regua_proximo||c.regua_proximo<=todayISO();
    regua=`
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 13px;border-radius:var(--radius-sm);background:${venceu?'var(--orange-soft)':'var(--surface2)'};border:1px solid ${venceu?'#f2ddb4':'var(--line)'}">
        <b style="font-size:13.5px">${tent?`${tent}ª tentativa`:'Aguardando resposta'}</b>
        <span style="font-size:12.5px;color:var(--muted)">de ${REGUA.tentativasMax} • ${venceu?'retorno vencido':'próximo retorno '+prox}</span>
        <div style="display:flex;gap:6px;margin-left:auto">
          <button class="btn small" onclick="marcarRespostaFicha('${c.id}')">✅ Respondeu</button>
          <button class="btn small ghost" onclick="zerarRegua('${c.id}')" title="Recomeçar a contagem de tentativas">↺ Zerar</button>
        </div>
      </div>`;
  } else if(rec){
    const txt=rec.fase==='atrasado'?`Recompra atrasada ${Math.abs(rec.faltam)} dia${Math.abs(rec.faltam)>1?'s':''}`
             :rec.fase==='hora'?`Hora de chamar • ciclo vence em ${rec.faltam} dia${rec.faltam!==1?'s':''}`
             :`Comprou há ${rec.dias} dias • ainda cedo`;
    regua=`
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 13px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--line)">
        <b style="font-size:13.5px">${txt}</b>
        <span style="font-size:12.5px;color:var(--muted)">${rec.ciclo.proprio?`ritmo próprio de ${rec.ciclo.dias}d`:`ciclo padrão de ${rec.ciclo.dias}d`} • último pedido ${fmt(rec.ultimo.data)}</span>
      </div>`;
  }

  return `
    <div class="card" style="margin:14px 0 4px;padding:14px;display:grid;gap:10px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <label style="margin:0;font-size:12px;color:var(--muted);flex-shrink:0">Etapa</label>
        <select onchange="mudarEtapaFicha('${c.id}',this.value)" style="max-width:260px">
          ${etapas.map(e=>`<option ${e===atual?'selected':''}>${esc(e)}</option>`).join('')}
        </select>
        <span style="font-size:12px;color:var(--muted)">muda na hora, sem abrir o formulário</span>
      </div>
      ${regua}
      ${c.status===ETAPA_CONTATO_ERRADO?`<div style="padding:11px 13px;border-radius:var(--radius-sm);background:var(--red-soft);border:1px solid #f0c2c2;font-size:13px">
        <b>📵 Fora das métricas</b> — este cadastro não entra na fila do dia, na conversão nem na recompra. Corrija o número abaixo e ele volta pra prospecção.
      </div>`:''}
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <label style="margin:0;font-size:12px;color:var(--muted);flex-shrink:0">WhatsApp</label>
        <input id="fx_whats_${c.id}" value="${esc(c.whatsapp||'')}" placeholder="45 99999-9999" style="max-width:200px">
        <button class="btn small" onclick="salvarWhatsFicha('${c.id}')">💾 Corrigir</button>
        ${c.status!==ETAPA_CONTATO_ERRADO?`<button class="btn small ghost" onclick="marcarContatoErrado('${c.id}');closeModal()" title="Número não existe ou não é da loja">📵 Contato errado</button>`:''}
        ${!numOk?`<span style="font-size:12.5px;color:var(--red);font-weight:600">📵 Número incompleto — precisa de DDD + 8 ou 9 dígitos</span>`
                :c.whatsapp?`<span style="font-size:12.5px;color:var(--green)">✔ número válido</span>`
                :`<span style="font-size:12.5px;color:var(--muted)">sem número cadastrado</span>`}
      </div>

// DDD (2) + 8 ou 9 dígitos, aceitando o 55 na frente
function whatsValido(num){
  let n=(num||'').replace(/\D/g,'');
  if(n.startsWith('55')) n=n.slice(2);
  return n.length===10||n.length===11;
}

async function mudarEtapaFicha(id,status){
  const c=state.clientes.find(x=>x.id===id);
  if(!c) return;
  const antes=c.status;
  c.status=status;
  c.updated_at=new Date().toISOString();
  // Sair de "aguardando" encerra a rodada da régua
  if(status!==ETAPA_AGUARDANDO){ c.regua_tentativas=0; c.regua_proximo=''; }

async function salvarWhatsFicha(id){
  const c=state.clientes.find(x=>x.id===id);
  if(!c) return;
  const novo=($(`fx_whats_${id}`)?.value||'').trim();
  if(novo&&!whatsValido(novo)){ toast('⚠️ Número incompleto: precisa de DDD + 8 ou 9 dígitos',5000); return; }
  // Evita gravar o mesmo número de outro cliente sem avisar
  const n=novo.replace(/\D/g,'');
  const dup=n&&state.clientes.find(x=>x.id!==id&&(x.whatsapp||'').replace(/\D/g,'')===n);
  if(dup&&!confirm(`Esse número já está em ${dup.loja||dup.nome}. Salvar mesmo assim?`)) return;
  const antes=c.whatsapp||'—';
  c.whatsapp=novo;
  c.updated_at=new Date().toISOString();
  // Número corrigido tira o cliente da quarentena e devolve pra fila
  const voltou=c.status===ETAPA_CONTATO_ERRADO&&novo&&whatsValido(novo);
  if(voltou){ c.status=ETAPA_PROSPECT; c.regua_tentativas=0; c.regua_proximo=''; }
  const i={id:uuid(),cliente_id:id,tipo:'📝 Outro',texto:`WhatsApp corrigido: ${antes} → ${novo||'—'}`,data:todayISO(),hora:new Date().toTimeString().slice(0,5),created_at:new Date().toISOString()};
  state.interacoes.unshift(i);
  await upsertRow('interacoes',i);
  await upsertRow('clientes',c);
  await cloudSave();
  toast(voltou?'✅ Número corrigido — cliente voltou pra prospecção':'✅ WhatsApp atualizado',voltou?4500:3000);
  openClient(id,_clientTab);
}

// Itens do pedido agrupados por categoria e, dentro dela, por item da
// tabela WIWU (película frontal, película de câmera, capa...).
function itensPorCategoriaView(itens){
  const porCat={};
  (itens||[]).forEach(i=>{
    const cat=i.categoria||'_sem';
    const sub=i.sub||subcategoriaProduto(i.produto,i.categoria)||'_outros';
    porCat[cat]=porCat[cat]||{};
    porCat[cat][sub]=porCat[cat][sub]||[];
    porCat[cat][sub].push(i);
  });
  const ordem=[...CATEGORIAS.map(c=>c.id),'_sem'];
  return `
    <div style="margin-top:11px;border-top:1px solid var(--line);padding-top:10px">
      ${ordem.filter(id=>porCat[id]).map(id=>{
        const cat=CATEGORIAS.find(c=>c.id===id);
        const subs=porCat[id];
        const unCat=Object.values(subs).flat().reduce((s,i)=>s+Number(i.quantidade||0),0);
        const atingiu=cat&&unCat>=cat.minimo;
        return `
        <div style="margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap">
            <b style="font-size:13px">${cat?cat.icon+' '+cat.label:'Sem categoria'}</b>
            <span style="font-size:12px;color:var(--muted)">${unCat} un</span>
            ${cat?`<span class="tag ${atingiu?'green':'warm'}" style="margin:0">${atingiu?'✔':'✕'} mín. ${cat.minimo}</span>`:''}
          </div>
          ${Object.entries(subs).sort((a,b)=>b[1].reduce((s,i)=>s+Number(i.quantidade||0),0)-a[1].reduce((s,i)=>s+Number(i.quantidade||0),0)).map(([sub,lista])=>{
            const un=lista.reduce((s,i)=>s+Number(i.quantidade||0),0);
            return `
            <div style="padding:6px 0 6px 12px;border-left:2px solid var(--line);margin-left:2px">
              <div style="display:flex;gap:8px;align-items:baseline">
                <span style="font-size:12.5px;font-weight:600;flex:1">${esc(sub==='_outros'?'Sem item identificado':labelSub(id,sub))}</span>
                <span style="font-size:12.5px;font-weight:700">${un} un</span>
              </div>
              ${lista.map(i=>`<div style="font-size:11.5px;color:var(--muted)">${i.quantidade}x ${esc((i.produto||'Produto').slice(0,56))}</div>`).join('')}
            </div>`;}).join('')}
        </div>`;}).join('')}
    </div>`;
}

function calcPreviewComissao(){
  const valor=parseFloat($('ped_valor')?.value||0);
  const frete=Math.max(0,parseFloat($('ped_frete')?.value||0));
  const fontes=parseInt($('ped_fontes')?.value||0);
  const tipo=$('ped_tipo')?.value||'novo';
  const cats=[...document.querySelectorAll('#pedidoOverlay .cat-item.selected')].map(el=>el.dataset.cat);
  const prev=$('comissaoPreview');
  if(!prev) return;
  if(!valor){ prev.innerHTML='<div style="color:var(--muted);font-size:13px">Informe o valor do pedido</div>'; return; }
  const com=calcComissao({tipo_cliente:tipo,valor,caixas_fonte:fontes,categorias:cats,data:$('ped_data')?.value||todayISO()});
  prev.innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
      <div class="metric"><small>Categorias</small><strong style="font-size:22px">${cats.length}</strong></div>
      <div class="metric"><small>% Comissão</small><strong style="font-size:22px">${com.pct}%</strong></div>
      <div class="metric"><small>Total para meta</small><strong style="font-size:18px">${fmtMoney(valor+frete)}</strong></div>
      <div class="metric"><small>Bônus fonte</small><strong style="font-size:22px">${fmtMoney(com.bonusFonte)}</strong></div>
    </div>
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
      <span style="color:var(--muted)">Comissão total estimada</span>
      <strong style="font-size:22px;color:var(--purple)">${fmtMoney(com.total)}</strong>
    </div>`;
}

async function savePedido(clienteId, pedidoId=null){
  const valor=parseFloat($('ped_valor')?.value||0);
  if(!valor){ toast('⚠️ Informe o valor do pedido'); return; }
  const cats=[...document.querySelectorAll('#pedidoOverlay .cat-item.selected')].map(el=>el.dataset.cat);
  const tipo=$('ped_tipo')?.value||'novo';
  const data=$('ped_data')?.value||todayISO();
  const frete=Math.max(0,parseFloat($('ped_frete')?.value||0));
  const com=calcComissao({tipo_cliente:tipo,valor,caixas_fonte:parseInt($('ped_fontes')?.value||0),categorias:cats,data});
  const anterior=pedidoId?state.pedidos.find(x=>x.id===pedidoId):null;
  const p={...anterior,id:pedidoId||uuid(),cliente_id:clienteId,tipo_cliente:tipo,valor,caixas_fonte:$('ped_fontes')?.value||0,categorias:cats,obs:$('ped_obs')?.value||'',comissao:com.total,comissao_pct:com.pct,bonus_fonte:com.bonusFonte,data,created_at:anterior?.created_at||new Date().toISOString(),updated_at:new Date().toISOString()};
  if(pedidoId) state.pedidos=state.pedidos.map(x=>x.id===pedidoId?p:x);
  else state.pedidos.unshift(p);
  state.pedidoDetalhes={...(state.pedidoDetalhes||{}),[p.id]:{...(state.pedidoDetalhes?.[p.id]||{}),frete,valor_total:valor+frete,updated_at:new Date().toISOString()}};
  // Atualizar categorias do cliente
  const c=state.clientes.find(x=>x.id===clienteId);
  if(c){ c.categorias=[...new Set([...normalizarCategorias(c.categorias||[]),...cats])]; c.tipo_cliente=tipo; c.status='❤️ Pós-venda / Recompra'; c.updated_at=new Date().toISOString(); await upsertRow('clientes',c); }
  await upsertRow('pedidos',p);
  await cloudSave();
  toast(`✅ Pedido ${pedidoId?'atualizado':'salvo'}! Comissão: ${fmtMoney(com.total)}`);
  $('pedidoOverlay')?.remove();
  if(document.getElementById('prospeccao')?.classList.contains('active') && typeof prospeccao==='function') prospeccao('fechados');
  else if(document.getElementById('faturamento')?.classList.contains('active')) faturamento();
  else if(document.getElementById('posvenda')?.classList.contains('active') && typeof posvenda==='function') posvenda();
  else openClient(clienteId,'pedidos');
}

async function deletePedido(id, clienteId){
  state.pedidos=state.pedidos.filter(x=>x.id!==id);
  if(state.pedidoDetalhes) delete state.pedidoDetalhes[id];
  await deleteRow('pedidos',id);
  await cloudSave();
  openClient(clienteId,'pedidos');
}

function openMercos(id){
  var c = state.clientes.find(function(x){return x.id===id});
  if(!c) return;
  var campos = [
    ['CNPJ *', c.cnpj||''],
    ['Razao Social *', c.razao_social||c.loja||''],
    ['Nome Fantasia', c.nome_fantasia||c.loja||''],
    ['Telefone *', c.whatsapp||''],
    ['E-mail *', c.email||''],
    ['Inscricao Estadual *', c.inscricao_estadual||'000000'],
    ['Instagram', c.instagram||''],
    ['CEP', c.cep||''],
    ['Endereco', c.endereco||''],
    ['Cidade', c.cidade||''],
    ['Estado', c.estado||''],
    ['Contato', c.nome||'']
  ];
  var faltando = campos.filter(function(f){return f[0].indexOf('*')>-1 && !f[1]}).map(function(f){return f[0].replace(' *','')});
  var html = '';
  html += '<div id="mercosOverlay" style="position:fixed;inset:0;z-index:300;background:rgba(20,22,32,.42);display:flex;align-items:center;justify-content:center;padding:20px">';
  html += '<div style="background:var(--panel);border-radius:var(--radius-lg);padding:22px;width:100%;max-width:500px;border:1px solid var(--line);box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  html += '<h3 style="margin:0;color:var(--text)">Exportar para Mercos</h3>';
  html += '<button onclick="this.parentNode.parentNode.parentNode.remove()" style="background:var(--surface2);border:0;color:var(--text);border-radius:12px;width:36px;height:36px;cursor:pointer;font-size:16px">x</button>';
  html += '</div>';
  html += '<p style="color:var(--muted);font-size:13px;margin:0 0 14px">Toque no campo para copiar</p>';
  if(faltando.length){
    html += '<div style="background:var(--red-soft);border:1px solid #f0c2c2;border-radius:14px;padding:12px;margin-bottom:14px;font-size:13px;color:var(--red)">Faltando: ' + faltando.join(', ') + '</div>';
  } else {
    html += '<div style="background:var(--green-soft);border:1px solid #c7ebd3;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--green)">Todos os campos obrigatorios preenchidos!</div>';
  }
  for(var i=0;i<campos.length;i++){
    var label = campos[i][0];
    var valor = campos[i][1];
    var border = label.indexOf('*')>-1 ? 'var(--purple-line)' : 'var(--line)';
    html += '<div onclick="copMercos(this)" data-val="' + String(valor).replace(/"/g,'&quot;') + '" style="background:rgba(255,255,255,.05);border:1px solid ' + border + ';border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">';
    html += '<div><div style="font-size:11px;color:var(--muted)">' + label + '</div>';
    html += '<div style="font-weight:600;color:var(--text);margin-top:2px">' + (valor || '<span style="color:var(--muted);font-weight:400">nao preenchido</span>') + '</div></div>';
    if(valor) html += '<span style="color:var(--muted)">copiar</span>';
    html += '</div>';
  }
  html += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

function copMercos(el){
  var txt = el.getAttribute('data-val');
  if(!txt) return;
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(function(){toast('Copiado!')});
  } else {
    var t = document.createElement('textarea');
    t.value = txt; t.style.position='fixed'; t.style.opacity='0';
    document.body.appendChild(t); t.select();
    document.execCommand('copy'); document.body.removeChild(t);
    toast('Copiado!');
  }
}

function linhaValor(t,r){return brNumero(t.match(new RegExp(r+'\\s*:?\\s*R\\$?\\s*([\\d.]+,\\d{2})','i'))?.[1])}

async function textoPdfArquivo(file){
  if(!window.pdfjsLib)throw new Error('Leitor de PDF não carregou. Atualize a página.');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  if(/fonte|carregador.*parede|cabo|kit.*carreg/.test(t))return'energia_basica';

  // de modelo/medida. Esses restos são sempre capa do aparelho citado.
  if(/iphone|pro\s*max|\bip\s?1[5-9]\b/.test(t))return'iphone';
  if(/macbook|mouse|\bhub\b|pasta|skin\s*pro/.test(t))return'macbook';
  if(/ipad|pencil|\bair\s*2\d|\d+(\.\d+)?"\/\d+"|10\.9|\(m[123]\b|\bm[123] (e|apenas)/.test(t))return'ipad';

  if(/watch|pulseira/.test(t))return'apple_watch'; if(/mochila|backpack|osun|warrior/.test(t))return'mochilas';
  if(/necessaire/.test(t))return'necessaires'; if(/fone|headset|airbud|airpod|ows/.test(t))return'fones';
  if(/itag|flash.?drive|carteira/.test(t))return'conectividade'; if(/trip[eé]|gimbal|microfone|pesco[cç]o/.test(t))return'fotografia';
  if(/veicular|automot|carro/.test(t))return'veicular'; if(/iphone|pel[ií]cula|camera|c[aâ]mera|capa|case/.test(t))return'iphone'; return'';
}

function registrarAcao(tipo){
  const key=todayISO();
  if(!state.registros) state.registros={};
  if(!state.registros[key]) state.registros[key]={ligacoes:0,contatos:0};
  state.registros[key][tipo]=(state.registros[key][tipo]||0)+1;
  cloudSave(); dashboard();
  toast(tipo==='ligacoes'?'📞 Ligação registrada!':'🤝 Contato registrado!');
}

function editMeta(campo){
  const nomes={contatosDia:'Meta diária de contatos',ligacoesDia:'Meta diária de ligações',contatosMes:'Meta mensal de clientes',faturamentoMes:'Meta de faturamento mensal (R$)'};
  const atual=(state.metas||{})[campo]||0;
  const novo=prompt(`${nomes[campo]||campo}:`,atual);
  if(novo===null) return;
  const val=parseFloat(novo.replace(',','.'));
  if(!val||val<1){toast('Valor inválido');return;}
  if(!state.metas) state.metas={};
  state.metas[campo]=val;
  cloudSave(); dashboard();
  toast('✅ Meta atualizada!');
}

function alertasInteligentes(){
  return state.clientes

}

function downloadICS(id){
  const l=state.lembretes.find(x=>x.id===id);
  if(!l) return;
  const [y,m,d]=(l.data||todayISO()).split('-');
  const h=(l.hora||'09:00').replace(':','');
  const hFim=`${String(parseInt(h.slice(0,2))+1).padStart(2,'0')}${h.slice(2)}`;
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//WIWU OS//PT','BEGIN:VEVENT',
    `UID:${l.id}@wiwuos`,`DTSTART:${y}${m}${d}T${h}00`,`DTEND:${y}${m}${d}T${hFim}00`,
    `SUMMARY:${l.titulo}${l.cliente?' - '+l.cliente:''}`,
    `DESCRIPTION:Cliente: ${l.cliente||''}\\nPrioridade: ${l.prioridade||''}`,
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  a.download=`lembrete_${l.titulo.replace(/\s+/g,'_')}.ics`;
  a.click();
  toast('📅 Abrindo no calendário...');
}

async function fairBuscaCep(val){
  const cep=(val||'').replace(/\D/g,'');
  if(cep.length<8) return;
  const d=await buscarCEP(cep);
  if(!d) return;
  if($('fl_end')&&!$('fl_end').value) $('fl_end').value=[d.logradouro,d.bairro].filter(Boolean).join(', ');
  if($('fl_cidade')) $('fl_cidade').value=d.localidade||'';
  if($('fl_estado')) $('fl_estado').value=d.uf||'';
  toast('📍 Endereço preenchido!');
}

async function fairBuscaCnpj(val){
  const cnpj = (val||'').replace(/\D/g,'');
  if(cnpj.length < 14) return;
  toast('🔍 Buscando CNPJ...');
  const d = await buscarCNPJ(cnpj);
  if(!d){ toast('❌ CNPJ não encontrado'); return; }
  // Preencher nome da loja se vazio
  const loja = d.nome_fantasia || d.razao_social || '';
  if($('fl_loja') && !$('fl_loja').value) $('fl_loja').value = loja;
  // Preencher endereço
  const end = [d.logradouro, d.numero, d.complemento, d.bairro].filter(Boolean).join(', ');
  if($('fl_end')) $('fl_end').value = end;
  if($('fl_cidade')) $('fl_cidade').value = d.municipio || '';
  if($('fl_estado')) $('fl_estado').value = d.uf || 'SP';
  // Preencher CEP
  const cep = (d.cep||'').replace(/\D/g,'');
  if($('fl_cep')) $('fl_cep').value = cep;
  toast('✅ CNPJ encontrado! Dados preenchidos.');
}

async function saveScript(){
  const titulo=$('sc_titulo')?.value?.trim();
  const texto=$('sc_texto')?.value?.trim();
  if(!titulo||!texto){toast('⚠️ Preencha título e texto');return;}
  if(!state.scripts) state.scripts=[];
  if(_scriptFormId===null) state.scripts.push({id:uuid(),titulo,texto});
  else { const s=state.scripts.find(x=>x.id===_scriptFormId); if(s){s.titulo=titulo;s.texto=texto;} }
  for(const sc of state.scripts) await upsertRow('scripts',sc);
  _scriptFormId=false;
  await cloudSave();
  toast('✅ Mensagem salva!'); mensagens();
}

async function deleteScript(id){
  const s=state.scripts?.find(x=>x.id===id);
  if(s?.slot){ toast('⚠️ Esta mensagem é usada pelo CRM — edite o texto em vez de excluir',5000); return; }
  if(!confirm('Excluir este script?')) return;
  state.scripts=state.scripts.filter(s=>s.id!==id);
  _scriptFormId=false;
  await cloudSave();
  toast('🗑️ Script excluído'); mensagens();
}

function copyText(id){
  const s=state.scripts?.find(x=>x.id===id);
  if(!s) return;
  navigator.clipboard.writeText(s.texto).then(()=>toast('📋 Copiado!')).catch(()=>toast('Erro ao copiar'));
}

      // Subcategoria: usa a salva no item ou descobre pelo nome do produto
      const sub = i.sub || subcategoriaProduto(i.produto, i.categoria) || '_outros';
      if(!subQtd[i.categoria]) subQtd[i.categoria] = {};

// ── FATURAMENTO ───────────────────────────────────────────────────
function mesesAte(mes, quantidade=6){
  const [ano,mesNumero]=mes.split('-').map(Number);
  return Array.from({length:quantidade},(_,i)=>{
    const d=new Date(ano,mesNumero-1-i,1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }).reverse();
}

function analiseClientesFaturamento(mes){
  const pedidos=pedidosValidos();
  const mesesRecorrencia=mesesAte(mes,6);
  const porCliente={};
  pedidosDoMes(mes).forEach(p=>{
    if(!porCliente[p.cliente_id]) porCliente[p.cliente_id]={valor:0,pedidos:0};
    porCliente[p.cliente_id].valor+=parseFloat(p.valor||0);
    porCliente[p.cliente_id].pedidos++;
  });
  const total=Object.values(porCliente).reduce((s,c)=>s+c.valor,0);
  let acumulado=0;
  return Object.entries(porCliente).map(([id,dados])=>{
    const cliente=state.clientes.find(c=>c.id===id);
    const mesesComCompra=mesesRecorrencia.filter(m=>pedidos.some(p=>p.cliente_id===id&&p.data?.slice(0,7)===m));
    let sequencia=0;
    for(let i=mesesRecorrencia.length-1;i>=0;i--){
      if(mesesComCompra.includes(mesesRecorrencia[i])) sequencia++; else break;
    }
    return {id,cliente,valor:dados.valor,pedidos:dados.pedidos,mesesComCompra:mesesComCompra.length,sequencia};
  }).filter(x=>x.cliente).sort((a,b)=>b.valor-a.valor).map(item=>{
    const percentualAntes=total?acumulado/total*100:0;
    const curva=percentualAntes<80?'A':percentualAntes<95?'B':'C';
    acumulado+=item.valor;
    return {...item,curva,participacao:total?item.valor/total*100:0};
  });
}

function faturamento(){
  const mes=_mesFaturamento||todayISO().slice(0,7);
  const pedMes=pedidosDoMes(mes);
  const fatProdutos=pedMes.reduce((s,p)=>s+parseFloat(p.valor||0),0);
  const freteTotal=pedMes.reduce((s,p)=>s+fretePedido(p),0);
  const fatTotal=fatProdutos+freteTotal;
  const fatNovo=pedMes.filter(p=>p.tipo_cliente==='novo').reduce((s,p)=>s+parseFloat(p.valor||0),0);
  const fatCart=pedMes.filter(p=>p.tipo_cliente==='carteira').reduce((s,p)=>s+parseFloat(p.valor||0),0);
  const comBase=pedMes.reduce((s,p)=>s+calcComissao(p).comissaoBase,0);
  const caixasVendidas=pedMes.reduce((s,p)=>s+parseInt(p.caixas_fonte||0,10),0);
  const bonusCaixas=pedMes.reduce((s,p)=>s+calcComissao(p).bonusFonte,0);
  const metaComissaoAtiva=!!state.comissao?.globalMeses?.[mes];
  const bonusGlobal=metaComissaoAtiva?fatProdutos*Number(state.comissao?.pctGlobal??1)/100:0;
  const comTotal=comBase+bonusCaixas+bonusGlobal;
  const meta=state.metas?.faturamentoMes||50000;
  const pct=Math.min(100,Math.round(fatTotal/meta*100));
  const clientesMes=analiseClientesFaturamento(mes);
  const clientesRecorrentes=clientesMes.filter(c=>c.mesesComCompra===6).length;
  const mesAnterior=mesesAte(mes,2)[0];
  const fatAnterior=pedidosDoMes(mesAnterior).reduce((s,p)=>s+valorMetaPedido(p),0);
  const variacao=fatAnterior?((fatTotal-fatAnterior)/fatAnterior*100):null;

  // Por categoria
  const catFat={};
  pedMes.forEach(p=>{const cats=normalizarCategorias(p.categorias||[]);cats.forEach(cat=>{catFat[cat]=(catFat[cat]||0)+parseFloat(p.valor||0)/Math.max(1,cats.length);});});

  $('faturamento').innerHTML=`

        <button class="btn ghost" onclick="abrirImportadorPedido()">📄 Importar pedido</button>
        <button class="btn ghost" onclick="editMeta('faturamentoMes')">✏️ Editar meta</button>
        <button class="btn ghost" onclick="editarComissao()">💸 Editar comissão</button>
        <button class="btn ${metaComissaoAtiva?'green':'ghost'}" onclick="alternarMetaComissao('${mes}')">${metaComissaoAtiva?'✅ Meta global: +1%':'🏆 Aplicar +1% da meta global'}</button>
        <button class="btn ghost" onclick="limparPedidosOrfaos()">🧹 Corrigir</button>
        ${mes==='2026-08'?'<button class="btn ghost danger" onclick="limparAgostoManterPdfs()">🗑️ Limpar antigos de agosto</button>':''}
      </div>
    </div>
    <div class="commission-card" style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px">
        <div><small style="color:var(--muted)">Total para a meta (produtos + frete)</small><div style="font-size:32px;font-weight:800;margin-top:4px">${fmtMoney(fatTotal)}</div><small style="color:var(--muted)">Produtos ${fmtMoney(fatProdutos)} • Frete ${fmtMoney(freteTotal)}</small></div>
        <div style="text-align:right"><small style="color:var(--muted)">Meta</small><div style="font-size:20px;font-weight:700">${fmtMoney(meta)}</div></div>
      </div>
      <div class="progress" style="height:10px"><div class="progress-bar" style="width:${pct}%;background:var(--purple)"></div></div>

async function limparAgostoManterPdfs(){

  if(!confirm(`ATENÇÃO: apagar ${antigos.length} pedido(s) antigo(s) de agosto e manter ${importados.length} importado(s) por PDF (${numeros})?`)) return;

}

// ── ⚡ FILA DO DIA (v5.5) ─────────────────────────────────────────
// Uma lista só, em ordem de urgência: o que precisa de ação hoje.
// Fontes: régua de follow-up, ciclo de recompra, lembretes e aniversários.
function filaDoDia(){
  const hoje=todayISO();
  const itens=[];
  // "Contato errado" fica fora da fila: sem número que funcione não há
  // ação possível hoje. Ele espera na aba própria até você corrigir.
  const ativo=c=>c&&c.status!==ETAPA_CONTATO_ERRADO;

  // 1. Aniversários do dia
  aniversariosHoje().filter(ativo).forEach(c=>{
    itens.push({
      tipo:'aniversario', c, urgencia:0,
      icone:'🎂', titulo:c.loja||c.nome,
      motivo:'Aniversário hoje',
      slot:'aniversario', acao:'Parabenizar',
    });
  });

  // 2. Prospecção — régua vencida (follow-up sem resposta)
  state.clientes.filter(c=>c.status===ETAPA_AGUARDANDO).filter(ativo).forEach(c=>{
    const proximo=c.regua_proximo||hoje;
    if(proximo>hoje) return;
    const tent=tentativasProspect(c);
    const atraso=diasEntre(proximo,hoje);
    itens.push({
      tipo:'regua', c, urgencia:1+Math.min(atraso,30)/100,
      icone:'🔁', titulo:c.loja||c.nome,
      motivo:`${tent?`${tent}ª tentativa sem resposta`:'Aguardando resposta'}${atraso>0?` • ${atraso} dia${atraso>1?'s':''} de atraso`:''}`,
      slot:'followup', acao:'Nova mensagem',
    });
  });

  // 3. Prospects a contatar (respeita o descanso de 30 dias da régua)
  state.clientes.filter(c=>c.status===ETAPA_PROSPECT).filter(ativo).forEach(c=>{
    if(c.regua_proximo&&c.regua_proximo>hoje) return;
    const voltou=c.regua_ultimo&&diasEntre(c.regua_ultimo,hoje)>=REGUA.descansoDias;
    itens.push({
      tipo:'primeiro', c, urgencia:4,
      icone:'🎯', titulo:c.loja||c.nome,
      motivo:voltou?'Voltou pra fila após 30 dias':'Primeiro contato pendente',
      slot:'primeiro_contato', acao:'Primeiro contato',
    });
  });

  // 4. Recompra — atrasado e na hora (silencia quem já foi avisado hoje ou adiado)
  state.clientes.filter(ativo).forEach(c=>{
    const r=statusRecompra(c);
    if(!r||r.fase==='cedo') return;
    if(c.recompra_avisado&&c.recompra_avisado>=hoje) return;
    const base=r.fase==='atrasado'?2:3;
    itens.push({
      tipo:'recompra', fase:r.fase, c, urgencia:base+Math.min(Math.abs(r.faltam),60)/1000,
      icone:r.fase==='atrasado'?'⚠️':'📦', titulo:c.loja||c.nome,
      motivo:r.fase==='atrasado'
        ? `Recompra atrasada ${Math.abs(r.faltam)} dia${Math.abs(r.faltam)>1?'s':''} • ciclo de ${r.ciclo.dias}d`
        : `Ciclo de ${r.ciclo.dias}d vence em ${r.faltam} dia${r.faltam!==1?'s':''} • último pedido ${fmt(r.ultimo.data)}`,
      slot:'recompra', acao:'Chamar pra recompra',
    });
  });

  // 5. Lembretes do dia (que não são follow-up automático da régua)
  (state.lembretes||[]).filter(l=>!l.feito&&(l.data||hoje)<=hoje&&!l.regua).forEach(l=>{
    const c=state.clientes.find(x=>x.id===l.cliente_id);
    if(c&&!ativo(c)) return;
    itens.push({
      tipo:'lembrete', c, lembrete:l, urgencia:1.5,
      icone:'⏰', titulo:l.titulo,
      motivo:`${l.cliente||''}${l.data&&l.data<hoje?` • atrasado desde ${fmt(l.data)}`:''}`.replace(/^ • /,''),
      slot:null, acao:null,
    });
  });

  return itens.sort((a,b)=>a.urgencia-b.urgencia);
}

  const itens=filaDoDia();

function filaLinha(i){
  const c=i.c;
  const acoes=[];
  if(i.tipo==='lembrete'){
    if(c?.whatsapp) acoes.push(`<button class="btn small green" onclick="filaWhats('${c.id}','followup')">💬</button>`);
    acoes.push(`<button class="btn small ghost" title="Concluir" onclick="doneReminder('${i.lembrete.id}');dashboard()">✓</button>`);
  } else {
    if(c?.whatsapp&&whatsValido(c.whatsapp)) acoes.push(`<button class="btn small green" title="${esc(i.acao||'WhatsApp')}" onclick="filaWhats('${c.id}','${i.slot}')">💬</button>`);
    else if(c?.whatsapp) acoes.push(`<button class="btn small ghost" title="Número incompleto — toque para corrigir" onclick="openClient('${c.id}')" style="color:var(--red)">📵</button>`);
    else if(c) acoes.push(`<button class="btn small ghost" title="Sem WhatsApp — toque para cadastrar" onclick="openClient('${c.id}')">＋📱</button>`);
    if(c?.instagram) acoes.push(`<a class="btn small ghost" href="${urlInsta(c.instagram)}" target="_blank" rel="noopener" title="Direct no Instagram (mensagem copiada)" onclick="event.preventDefault();filaInsta('${c.id}','${i.slot}')">📸</a>`);
    if(i.tipo==='regua') acoes.push(`<button class="btn small ghost" title="Cliente respondeu" onclick="marcarResposta('${c.id}');dashboard()">✅</button>`);
    if(i.tipo==='recompra') acoes.push(`<button class="btn small ghost" title="Adiar 7 dias" onclick="adiarRecompra('${c.id}')">⏭️</button>`);
  }
  const clickable=c?`onclick="openClient('${c.id}')" style="cursor:pointer"`:'';
  return `
    <div style="display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)">
      <span style="font-size:18px;width:22px;text-align:center;flex-shrink:0">${i.icone}</span>
      <div style="flex:1;min-width:0" ${clickable}>
        <b style="display:block;font-size:14.5px;font-weight:600">${esc(i.titulo)}</b>
        <span style="font-size:12.5px;color:var(--muted)">${esc(i.motivo)}</span>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">${acoes.join('')}</div>
    </div>`;
}
